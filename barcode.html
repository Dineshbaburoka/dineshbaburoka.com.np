<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <title>Barcode Sticker Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    /* Input Form (hidden on print) */
    .form {
      margin: 15px auto;
      text-align: center;
    }
    input, select {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #999;
      border-radius: 4px;
      margin: 4px;
    }
    button {
      padding: 6px 14px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    button:hover {
      background: #1d4ed8;
    }

    /* Sticker base */
    .card {
      border: 2px dashed #000;   /* स्पष्ट border थपियो */
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 2mm;
      margin: auto;
    }

    /* Header section */
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 1mm;
    }
    .logo {
      position: absolute;
      top: 0;
      left: 0;
      width: 6mm;
      height: 6mm;
      object-fit: contain;
    }
    .title {
      font-size: 10pt;
      font-weight: bold;
      color: #111827;
      line-height: 1.2;
    }
    .name {
      font-size: 9pt;
      font-weight: bold;
      color: #1e293b;
      margin-top: 1mm;
    }

    /* Barcode section */
    .barcode-box {
      text-align: center;
      margin-top: -1mm;
    }
    svg {
      max-width: 100%;
      height: auto;
    }

    @media print {
      .form { display: none; }
      body { background: #fff; }
      .card { 
        margin: 0mm auto; 
        box-shadow: none; 
        page-break-inside: avoid; 
      }
    }
  </style>
</head>
<body>
  <!-- Input form -->
  <div class="form">
    <select id="nameSelect" onchange="toggleCustomName()">
      <option value="">-- नाम छान्नुहोस् --</option>
      <option value="प्रिन्टर">प्रिन्टर</option>
      <option value="कम्प्युटर">कम्प्युटर</option>
      <option value="डेस्कटप कम्प्युटर">डेस्कटप कम्प्युटर</option>
      <option value="मोटर साइलकल">मोटर साइलकल</option>
      <option value="कुकुरको खोर">कुकुरको खोर</option>
      <option value="कुर्सी">कुर्सी</option>
      <option value="टेबुल">टेबुल</option>
      <option value="स्टिल दराज">स्टिल दराज</option>
      <option value="वाल पंखा">वाल पंखा</option>
      <option value="टेबुल पंखा">टेबुल पंखा</option>
      <option value="हिटर">हिटर</option>
      <option value="Other">अन्य</option>
    </select>

    <input id="customName" type="text" placeholder="नाम लेख्नुहोस्" style="display:none;" />
    <input id="entry" type="text" placeholder="Number उल्लेख गर्नुहोस्" value="" />

    <select id="size" onchange="applySize()">
      <option value="100x50">100 x 50 mm</option>
      <option value="70x40">70 x 40 mm</option>
      <option value="50x30">50 x 30 mm</option>
    </select>

    <button onclick="generate()">Generate</button>
    <button onclick="window.print()">Print</button>
  </div>

  <!-- Sticker card -->
  <div class="card" id="stickerCard">
    <div class="header">
      <img src="logo.png" alt="Logo" class="logo" />
      <div class="title">गलकोट नगरपालिका</div>
      <div id="showName" class="name"></div>
    </div>
    <div class="barcode-box">
      <svg id="barcode"></svg>
    </div>
  </div>

  <script>
    function toggleCustomName() {
      const select = document.getElementById("nameSelect");
      const custom = document.getElementById("customName");
      if (select.value === "Other") {
        custom.style.display = "inline-block";
      } else {
        custom.style.display = "none";
      }
    }

    function applySize() {
      const size = document.getElementById("size").value;
      const card = document.getElementById("stickerCard");
      let w, h;

      if (size === "100x50") { w = 100; h = 50; }
      if (size === "70x40") { w = 70; h = 40; }
      if (size === "50x30") { w = 50; h = 30; }

      card.style.width = w + "mm";
      card.style.height = h + "mm";

      const style = document.getElementById("printStyle") || document.createElement("style");
      style.id = "printStyle";
      style.innerHTML = `@page { size: ${w}mm ${h}mm; margin:0; }`;
      document.head.appendChild(style);
    }

    function generate() {
      const selectName = document.getElementById("nameSelect").value;
      const customName = document.getElementById("customName").value.trim();
      const name = (selectName === "Other") ? customName : selectName;
      const number = document.getElementById("entry").value.trim();
      const size = document.getElementById("size").value;

      if (!name) {
        alert("कृपया नाम छान्नुहोस् वा लेख्नुहोस्");
        return;
      }
      if (!number) {
        alert("कृपया Number राख्नुहोस्");
        return;
      }

      document.getElementById("showName").textContent = name || "";

      let barWidth = 2.0, barHeight = 40, fontSize = 14;
      if (size === "100x50") { barWidth = 2.2; barHeight = 80; fontSize = 35; }
      if (size === "70x40")  { barWidth = 2.0; barHeight = 68; fontSize = 28; }
      if (size === "50x30")  { barWidth = 1.6; barHeight = 39; fontSize = 19; }

      JsBarcode("#barcode", number, {
        format: "CODE128",
        lineColor: "#000",
        width: barWidth,
        height: barHeight,
        displayValue: true,
        text: number,
        fontSize: fontSize,
        fontWeight: "bold",
        margin: 0
      });
    }

    window.onload = function() {
      applySize();
    };
  </script>
</body>
</html>
