<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>जग्गा तथा भवन मूल्याङ्कन र कर निर्धारण प्रणाली</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
      background: #f1f8e9;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      color: #2e7d32;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    select, input[type=number], button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #a5d6a7;
      box-sizing: border-box;
    }
    button {
      background-color: #388e3c;
      color: white;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2e7d32;
    }
    .flex-row {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .flex-row input {
      flex: 1;
      text-align: center;
    }
    .result {
      background: #e8f5e9;
      margin-top: 20px;
      padding: 15px;
      border-left: 5px solid #43a047;
      font-size: 18px;
      font-weight: 700;
    }
    .toggle-btns {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .toggle-btns button {
      flex: 1;
      background-color: #a5d6a7;
      color: #2e7d32;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .toggle-btns button.active {
      background-color: #388e3c;
      color: white;
    }
  </style>
</head>

    <option value="1">१</option>

    <option value="3">३</option>
    <option value="4">४</option>
    <option value="5">५</option>
    <option value="6">६</option>
    <option value="7">७</option>
    <option value="8">८</option>
    <option value="9">९</option>
    <option value="10">१०</option>
    <option value="11">११</option>
  </select>

    <option value="">-- जग्गाको प्रकार छान्नुहोस् --</option>
    <option value="commercial">व्यावसायिक</option>
    <option value="residential">आवासीय</option>
    <option value="agriculture">कृषि</option>
  </select>

  <label for="detail">जग्गाको समुह</label>
  <select id="detail">
    <option value="">--जग्गाको समुह छान्नुहोस् --</option>
  </select>

  <div class="toggle-btns">
    <button id="btnSqft" class="active" type="button">सम्पत्ति मूल्याङ्कन</button>
    <button id="btnRAPD"  type="button">जग्गाको मात्र मूल्याङ्कन</button>
    
  </div>

    <div class="flex-row">
      <input type="number" id="ropani" min="0" placeholder="रोपनी" />
      <input type="number" id="aana" min="0" max="15" placeholder="आना" />
      <input type="number" id="paisa" min="0" max="3" placeholder="पैसा" />
      <input type="number" id="dam" min="0" max="3" placeholder="दाम" />
    </div>
  </div>

    categorySel.addEventListener('change', resetDetailAndRate);

    function resetDetailAndRate() {
      detailSel.innerHTML = '<option value="">-- विवरण छान्नुहोस् --</option>';
      rateInput.value = '';
      if (!wardSel.value || !categorySel.value) return;

      // विवरणहरु सेट गर्ने
      const data = rateData[wardSel.value];
      if (!data) return;
      const catData = data[categorySel.value];
      if (!catData) return;

      Object.keys(catData).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key;
        detailSel.appendChild(option);
      });
    }

    // विवरण छान्दा दर सेट गर्ने
    detailSel.addEventListener('change', () => {
      const w = wardSel.value;
      const c = categorySel.value;
      const d = detailSel.value;
      if (w && c && d && rateData[w] && rateData[w][c] && rateData[w][c][d]) {
        rateInput.value = rateData[w][c][d];
      } else {
        rateInput.value = '';
      }
    });

    // इनपुट मोड टगल गर्ने
    btnRAPD.addEventListener('click', () => {
      btnRAPD.classList.add('active');
      btnSqft.classList.remove('active');
      inputRAPD.style.display = 'block';
      inputSqft.style.display = 'none';
    });
    btnSqft.addEventListener('click', () => {
      btnSqft.classList.add('active');
      btnRAPD.classList.remove('active');
      inputSqft.style.display = 'block';
      inputRAPD.style.display = 'none';

    function calculateValuation() {
      const rate = +rateInput.value;
      if (!rate) {
        alert('कृपया मूल्याङ्कनको आधार छान्नुहोस्');
        return;
      }

      let landInRopani = 0;
      if (btnRAPD.classList.contains('active')) {
        // RAPD बाट क्षेत्रफल गणना
        const ro = +document.getElementById('ropani').value || 0;
        const aa = +document.getElementById('aana').value || 0;
        const pa = +document.getElementById('paisa').value || 0;
        const da = +document.getElementById('dam').value || 0;
        if(aa > 15 || pa > 3 || da > 3){
          alert('आना ०-१५, पैसा ०-३, दाम ०-३ को बीचमा हुनुपर्छ।');
          return;
        }
        landInRopani = ro + aa/16 + pa/64 + da/256;
        if (landInRopani <= 0) {
          alert('घरले चर्चेको जग्गाको तथा जग्गाको क्षेत्रफल प्रविष्टी गर्नेहोस।');
          return;
        }
      } else {
        // Sq.Ft बाट क्षेत्रफल रोपनीमा रूपान्तरण
        const sqft = +document.getElementById('sqft').value || 0;
        if (sqft <= 0) {
          alert('घरले चर्चेको जग्गाको तथा जग्गाको क्षेत्रफल प्रविष्टी गर्नेहोस।');
          return;
        }
        // 1 रोपनी = 5476 Sq.Ft (लगभग)
        landInRopani = sqft / 5476;
      }

      // जग्गाको मूल्याङ्कन
      const landVal = Math.round(landInRopani * rate);
      document.getElementById('landResult').textContent = `घरले चर्चेको जग्गाको तथा जग्गा मूल्याङ्कन: रू ${landVal.toLocaleString('ne-NP')}`;

      // भवन मूल्याङ्कन
      const buildSqft = +document.getElementById('buildSqft').value || 0;
      const structureRate = +document.getElementById('structure').value || 0;
      let buildVal = 0;
      if (buildSqft > 0 && structureRate > 0) {
        buildVal = Math.round(buildSqft * structureRate);
        document.getElementById('buildingResult').textContent = `भवन मूल्याङ्कन: रू ${buildVal.toLocaleString('ne-NP')}`;
      } else {
        document.getElementById('buildingResult').textContent = 'भवनको मूल्याङ्कन भएको छैन कृपया भवन मूल्याङ्कनको आधार तथा भवनको क्षेत्रफल प्रविष्ट गर्नुहोस';
      }

      // कुल मूल्याङ्कन
      const totalVal = landVal + buildVal;
      document.getElementById('totalResult').textContent = `कुल मूल्याङ्कन: रू ${totalVal.toLocaleString('ne-NP')}`;
    }
  </script>
</body>
</html>
