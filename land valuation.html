    }

      border-color: #00796b;
      box-shadow: 0 0 5px #00796baa;
    }
    .area-inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .area-inputs input {
      text-align: center;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px 0;
      background: #00796b;
      border: none;
      color: white;
      font-size: 20px;

      font-weight: 700;

    }
    button:hover {

    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: #b2dfdb;
      border-radius: 12px;
      font-weight: 700;
      font-size: 22px;
      color: #004d40;
      text-align: center;
      box-shadow: inset 0 0 10px #00796baa;
    }
    @media (max-width: 480px) {
      .area-inputs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    const wardSel = document.getElementById('ward');
    const catSel = document.getElementById('category');
    const detSel = document.getElementById('detail');
    const rateDisp = document.getElementById('rateDisplay');
    const valDisp = document.getElementById('valueDisplay');
    const btn = document.getElementById('calculateBtn');

    wardSel.addEventListener('change', () => {
      detSel.innerHTML = '<option value="">-- विवरण छान्नुहोस् --</option>';
      rateDisp.textContent = '';
      valDisp.textContent = '';
      catSel.value = '';
    });

    catSel.addEventListener('change', () => {
      detSel.innerHTML = '<option value="">-- विवरण छान्नुहोस् --</option>';
      rateDisp.textContent = '';
      valDisp.textContent = '';
      const w = wardSel.value;
      const c = catSel.value;
      if (rateData[w] && rateData[w][c]) {
        Object.keys(rateData[w][c]).forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = key;
          detSel.appendChild(opt);
        });
      }
    });

    btn.addEventListener('click', () => {
      const w = wardSel.value, c = catSel.value, d = detSel.value;
      if (!w || !c || !d) {
        alert('कृपया वडा, क्षेत्र र विवरण सबै छान्नुहोस्।');
        return;
      }
      const rate = rateData[w][c][d];
      if (!rate) {
        alert('छानिएको विवरणको दर उपलब्ध छैन।');
        return;
      }
      const ro = +document.getElementById('ropani').value || 0;
      const aa = +document.getElementById('aana').value || 0;
      const pa = +document.getElementById('paisa').value || 0;
      const da = +document.getElementById('dam').value || 0;

      // Validation for max values
      if(aa > 15 || pa > 3 || da > 3){
        alert('आना ०-१५, पैसा ०-३, दाम ०-३ को बीचमा हुनुपर्छ।');
        return;
      }

      const totalR = ro + aa/16 + pa/64 + da/256;
      if(totalR === 0){
        alert('क्षेत्रफल ० भन्दा ठूलो हुनुपर्छ।');
        return;
      }
      rateDisp.textContent = `दर: रू ${rate.toLocaleString('ne-NP')} प्रति रोपनी`;
      const val = Math.round(totalR * rate);
      valDisp.textContent = `कुल मूल्याङ्कन: रू ${val.toLocaleString('ne-NP')}`;
    });
  </script>
