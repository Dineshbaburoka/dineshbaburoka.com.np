<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>काष्ठ व्यवस्थापन — Furniture Business ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#F7F2E9;
    --panel:#FFFFFF;
    --ink:#2B1B12;
    --ink-soft:#6B5544;
    --wood:#8B5E34;
    --wood-dark:#5E3E22;
    --forest:#3F5230;
    --amber:#C97C3B;
    --line:#E7DCC8;
    --danger:#A8442E;
    --ok:#3F5230;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces','Noto Sans Devanagari',serif;}
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:230px; background:var(--wood-dark); color:#F2E8D9; flex-shrink:0;
    display:flex; flex-direction:column; padding:20px 0;
  }
  #sidebar .brand{padding:0 20px 18px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:10px;}
  #sidebar .brand .title{font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1.2;}
  #sidebar .brand .sub{font-size:11px; opacity:.65; margin-top:4px; letter-spacing:.04em;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 20px; cursor:pointer;
    font-size:14.5px; color:#EADFC9; opacity:.82; border-left:3px solid transparent;
    transition:.15s;
  }
  .nav-item:hover{opacity:1; background:rgba(255,255,255,0.06);}
  .nav-item.active{opacity:1; background:rgba(201,124,59,0.18); border-left-color:var(--amber); font-weight:600;}
  .nav-emoji{width:18px; text-align:center;}

  /* Main */
  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  #topbar{
    height:60px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  }
  #topbar .page-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  #topbar .user-chip{font-size:13px; color:var(--ink-soft);}
  #content{padding:24px; overflow-y:auto; flex:1;}

  /* Cards / tables */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px;}
  .grid{display:grid; gap:16px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; border-top:3px solid var(--wood);}
  .kpi .label{font-size:12px; color:var(--ink-soft); letter-spacing:.03em;}
  .kpi .value{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin-top:4px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:hover td{background:#FBF7EF;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:7px; border:none;
    font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--wood); color:#fff;}
  .btn-primary:hover{background:var(--wood-dark);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-outline:hover{background:#F1E9D8;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid #E3C9C2;}
  .btn-sm{padding:5px 10px; font-size:12px;}
  input,select,textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  label{font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; display:block; font-weight:600;}
  .field{margin-bottom:12px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:160px;}
  .badge{padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-green{background:#E7EEDF; color:var(--forest);}
  .badge-amber{background:#F7E7D3; color:var(--amber);}
  .badge-red{background:#F3DEDA; color:var(--danger);}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .section-title{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0 0 16px;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,27,18,.45); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{background:#fff; border-radius:12px; width:100%; max-width:560px; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 16px; font-family:'Fraunces',serif;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  /* ID Card */
  .idcard{
    width:340px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(43,27,18,.12); font-family:'Inter',sans-serif;
  }
  .idcard-head{background:var(--wood-dark); color:#F7EFDF; padding:12px 16px;}
  .idcard-head .co{font-family:'Fraunces',serif; font-weight:700; font-size:15px;}
  .idcard-body{padding:14px 16px; display:flex; gap:12px;}
  .idcard-photo{width:70px; height:80px; background:#EFE6D4; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .idcard-foot{background:#F1E9D8; padding:8px 16px; font-size:11px; color:var(--ink-soft);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#F7F2E9,#EFE1C8);}
  .login-box{background:#fff; padding:36px; border-radius:14px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(43,27,18,.15); border-top:4px solid var(--wood);}
  .msg{padding:9px 12px; border-radius:7px; font-size:13px; margin-bottom:12px;}
  .msg-error{background:#F3DEDA; color:var(--danger);}
  .msg-ok{background:#E7EEDF; color:var(--forest);}
  ::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:#D9C9A8; border-radius:4px;}
  @media print{
    #sidebar,#topbar,.no-print{display:none !important;}
    #content{padding:0;}
  }

  /* Loading overlay */
  #loading-overlay{
    position:fixed; inset:0; background:rgba(247,242,233,.7); z-index:999;
    display:none; align-items:center; justify-content:center; backdrop-filter:blur(1px);
  }
  #loading-overlay.show{display:flex;}
  .spinner{
    width:38px; height:38px; border:4px solid #E7DCC8; border-top-color:var(--wood);
    border-radius:50%; animation:spin .7s linear infinite;
  }

  /* Toast notifications */
  #toast-wrap{position:fixed; top:16px; right:16px; z-index:1000; display:flex; flex-direction:column; gap:8px; max-width:320px;}
  .toast{
    background:#2B1B12; color:#F7F2E9; padding:11px 14px; border-radius:8px; font-size:13px;
    box-shadow:0 8px 20px rgba(0,0,0,.2); display:flex; align-items:flex-start; gap:8px;
    animation:toast-in .2s ease-out;
  }
  .toast.ok{border-left:4px solid var(--forest);}
  .toast.error{border-left:4px solid var(--danger);}
  .toast.warning{border-left:4px solid var(--amber);}
  @keyframes toast-in{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

  /* Notification bell */
  .bell-wrap{position:relative; cursor:pointer;}
  .bell-dot{
    position:absolute; top:-3px; right:-3px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:700; border-radius:20px; min-width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .bell-panel{
    position:absolute; top:36px; right:0; width:320px; max-height:400px; overflow-y:auto;
    background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.18);
    z-index:80; display:none;
  }
  .bell-panel.show{display:block;}
  .bell-item{padding:11px 14px; border-bottom:1px solid var(--line); font-size:12.5px;}
  .bell-item:last-child{border-bottom:none;}
  .bell-item .t{font-weight:600; font-size:13px;}
  .bell-item .m{color:var(--ink-soft); margin-top:2px;}
  .bell-item.unread{background:#FBF3E4;}

  /* Locked/disabled nav (no permission) */
  .nav-item.locked{opacity:.35; cursor:not-allowed;}
  .role-badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700;
    background:rgba(201,124,59,.2); color:var(--amber); margin-left:6px; text-transform:uppercase;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn[disabled]{opacity:.55; cursor:not-allowed; pointer-events:none;}
  .btn .btn-spinner{
    width:13px; height:13px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff;
    border-radius:50%; animation:spin .6s linear infinite; display:inline-block; margin-right:2px;
  }

  /* Print invoice */
  .print-bill{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%; padding:20px;}
  }
  .bill-table{width:100%; border-collapse:collapse; margin-top:10px;}
  .bill-table th,.bill-table td{border:1px solid #333; padding:6px 8px; font-size:13px;}
  .bill-table th{background:#f2f2f2;}
</style>
</head>
<body>

<div id="root"></div>
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="print-area"></div>
<div id="toast-wrap"></div>

<script>
/* =====================================================================
   CONFIG — यहाँ आफ्नो Supabase Project को URL र anon key राख्नुहोस्
   Supabase Dashboard > Project Settings > API बाट पाइन्छ
===================================================================== */
const SUPABASE_URL = "https://tlztidqyjtcndymwqhds.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_O2oBMbR6PUBLqgwCves_8A_KlBNCj_h";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const COMPANY = {
  name: "फर्निचर उद्योग",
  tagline: "Handcrafted Wood Furniture",
  address: "पोखरा, गण्डकी प्रदेश",
  phone: "9857626542",
  pan_no: "121797638",   // यहाँ आफ्नो व्यवसायको PAN/VAT नं. राख्नुहोस्
  bank_name: "नेपाल बैंक लि.",
  bank_account: "0123456789012",
  payment_qr_text: "9857626542", // eSewa/Khalti/Bank QR मा payload बनाउन प्रयोग हुने (फोन/खाता नं.)
};
// तलब कटौतीका दरहरू (आवश्यक अनुसार परिवर्तन गर्नुहोस्)
const SALARY_RULES = {
  pf_employee_percent: 10,   // प्रोभिडेन्ट फन्ड (कर्मचारी अंश)
  pf_employer_percent: 10,   // प्रोभिडेन्ट फन्ड (संस्था अंश) — रिपोर्टमा मात्र देखिने, खुद तलबबाट नकट्ने
  cit_percent: 8.33,         // Citizen Investment Trust (वैकल्पिक — प्रयोग नगरे 0 राख्नुहोस्)
  tds_percent: 1,            // पारिश्रमिकमा अग्रिम आयकर (Tax Deduction at Source)
};
// Storage bucket नाम — Supabase Dashboard > Storage मा यही नामको public bucket बनाउनुहोस्
const STORAGE_BUCKET = 'employee-files';

/* सामान्य फाइल अपलोड helper — Supabase Storage मा राखी public URL फर्काउने */
async function uploadToStorage(file, folder){
  if (!file) return null;
  const ext = file.name.split('.').pop();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, file);
  if (error) throw error;
  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}
/* QR कोड (payment/ID card) बनाउने helper — canvas बाट data URL फर्काउने */
async function makeQrDataUrl(text, size=140){
  try{
    const canvas = document.createElement('canvas');
    await QRCode.toCanvas(canvas, text, { width:size, margin:1 });
    return canvas.toDataURL('image/png');
  }catch(e){ console.error('QR error', e); return null; }
}

let state = {
  user: null, page: 'dashboard', employees: [], products: [],
  profile: null,        // row from user_profiles
  roleKey: null,        // e.g. 'super_admin'
  roleLabel: '',
  perms: {},            // { module_key: {can_view,can_create,can_edit,can_delete,can_export,can_print} }
  notifications: [],
  unreadCount: 0,
};

const root = document.getElementById('root');
const NPR = n => 'रु. ' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const todayStr = () => new Date().toISOString().slice(0,10);

/* ---------------------------------------------------------------------
   TOAST NOTIFICATIONS — replaces raw alert() for a professional feel
--------------------------------------------------------------------- */
function toast(message, kind='ok', ms=4000){
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  const icon = kind==='error' ? '⚠️' : kind==='warning' ? '🔔' : '✅';
  el.innerHTML = `<span>${icon}</span><span>${message}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 250); }, ms);
}
window.toast = toast;

/* ---------------------------------------------------------------------
   PERMISSIONS — loaded once per login, cached in state.perms
--------------------------------------------------------------------- */
async function loadRoleAndPermissions(){
  if (!state.user){ state.profile=null; state.roleKey=null; state.perms={}; return; }
  try{
    const { data: profile, error: pErr } = await sb
      .from('user_profiles').select('*, roles(key,label_en,label_ne)')
      .eq('id', state.user.id).maybeSingle();
    if (pErr) throw pErr;
    state.profile = profile || null;
    state.roleKey = profile?.roles?.key || null;
    state.roleLabel = profile?.roles?.label_ne || profile?.roles?.label_en || '';
    if (!profile){ state.perms = {}; return; }
    const { data: perms, error: permErr } = await sb
      .from('permissions').select('*').eq('role_id', profile.role_id);
    if (permErr) throw permErr;
    const map = {};
    (perms||[]).forEach(p => { map[p.module_key] = p; });
    state.perms = map;
  }catch(e){
    console.error('Permission load failed', e);
    // Fail safe: if roles/permissions tables don't exist yet (Phase 1 SQL not run),
    // fall back to full access so the app never gets locked out.
    state.perms = null;
  }
}
// canDo(module,'view'|'create'|'edit'|'delete'|'export'|'print')
function canDo(moduleKey, action='view'){
  if (state.perms === null) return true; // fallback mode (schema not migrated yet)
  if (state.roleKey === 'super_admin') return true;
  const p = state.perms[moduleKey];
  if (!p) return false;
  return !!p[`can_${action}`];
}
window.canDo = canDo;

/* ---------------------------------------------------------------------
   AUDIT LOG — call after any insert/update/delete/print/export/login
--------------------------------------------------------------------- */
async function logAudit(action, moduleKey, recordId=null, details=null){
  try{
    await sb.from('audit_log').insert({
      user_id: state.user?.id || null,
      user_email: state.user?.email || null,
      action, module_key: moduleKey, record_id: recordId ? String(recordId) : null,
      details: details ? details : null,
    });
  }catch(e){
    // Audit logging must never break the main workflow — just log to console.
    console.warn('Audit log failed (Phase 1 SQL may not be migrated yet):', e.message||e);
  }
}
window.logAudit = logAudit;

/* ---------------------------------------------------------------------
   NOTIFICATIONS BELL
--------------------------------------------------------------------- */
async function refreshNotifications(){
  try{
    // best-effort: regenerate low-stock alerts (safe no-op if function/table missing)
    await sb.rpc('generate_low_stock_notifications');
  }catch(e){ /* ignore if not migrated yet */ }
  try{
    const { data, error } = await sb.from('notifications')
      .select('*').order('created_at', { ascending:false }).limit(30);
    if (error) throw error;
    state.notifications = data || [];
    state.unreadCount = (data||[]).filter(n=>!n.is_read).length;
  }catch(e){
    state.notifications = []; state.unreadCount = 0;
  }
  renderBell();
}
function renderBell(){
  const dot = document.getElementById('bell-dot');
  const panel = document.getElementById('bell-panel');
  if (!dot || !panel) return;
  dot.style.display = state.unreadCount > 0 ? 'flex' : 'none';
  dot.innerText = state.unreadCount > 9 ? '9+' : String(state.unreadCount);
  panel.innerHTML = state.notifications.length ? state.notifications.map(n => `
    <div class="bell-item ${n.is_read?'':'unread'}">
      <div class="t">${severityIcon(n.severity)} ${n.title}</div>
      <div class="m">${n.message||''}</div>
    </div>`).join('') : `<div class="bell-item">कुनै सूचना छैन</div>`;
}
function severityIcon(sev){ return sev==='critical' ? '🔴' : sev==='warning' ? '🟠' : '🔵'; }
window.toggleBell = async ()=>{
  const panel = document.getElementById('bell-panel');
  if (!panel) return;
  const opening = !panel.classList.contains('show');
  panel.classList.toggle('show');
  if (opening && state.unreadCount > 0){
    try{
      await sb.from('notifications').update({ is_read:true }).eq('is_read', false);
      state.notifications = state.notifications.map(n=>({...n, is_read:true}));
      state.unreadCount = 0;
      renderBell();
    }catch(e){}
  }
};

/* ---------------------------------------------------------------------
   LOADING HELPERS — overlay for page loads, button-lock for actions
--------------------------------------------------------------------- */
function showOverlay(){ document.getElementById('loading-overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('loading-overlay').classList.remove('show'); }

// बटनमा click हुँदा double-click रोक्ने + spinner देखाउने wrapper
async function busy(btnEl, fn){
  if (!btnEl || btnEl.disabled) return; // पहिल्यै चलिरहेको छ भने फेरि नचलाउने
  const original = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = `<span class="btn-spinner"></span> ...`;
  try{
    await fn();
  }catch(e){
    console.error(e);
    toast('त्रुटि भयो: ' + (e.message||e), 'error', 6000);
  }finally{
    btnEl.disabled = false;
    btnEl.innerHTML = original;
  }
}

/* ---------------------------------------------------------------------
   AUTH
--------------------------------------------------------------------- */
async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  state.user = session ? session.user : null;
  if (state.user) await loadRoleAndPermissions();
  render();
  if (state.user) refreshNotifications();
}

async function login(email, pass){
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return error.message;
  await checkSession();
  if (state.user){
    try{ await sb.from('user_profiles').update({ last_login: new Date().toISOString() }).eq('id', state.user.id); }catch(e){}
    logAudit('login', 'auth');
    toast('स्वागत छ! (Welcome back)', 'ok');
  }
  return null;
}
async function signup(email, pass, fullName){
  const { error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ full_name: fullName } } });
  if (error) return error.message;
  return null;
}
async function logout(){
  logAudit('logout', 'auth');
  await sb.auth.signOut();
  state.user=null; state.profile=null; state.roleKey=null; state.perms={};
  render();
}

function renderLogin(){
  root.innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div style="text-align:center; margin-bottom:20px;">
        <div class="display" style="font-size:24px; font-weight:700; color:var(--wood-dark);">${COMPANY.name}</div>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">व्यवसाय व्यवस्थापन प्रणाली</div>
      </div>
      <div id="login-msg"></div>
      <div class="field"><label>इमेल</label><input id="li-email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>पासवर्ड</label><input id="li-pass" type="password" placeholder="••••••••"/></div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; padding:10px;" onclick="doLogin()">लगइन गर्नुहोस्</button>
      <div style="text-align:center; margin-top:14px; font-size:12.5px; color:var(--ink-soft);">

/* -------- साना chart helpers (कुनै बाह्य लाइब्रेरी बिना, शुद्ध SVG) -------- */
function monthLabelsBack(n){
  const out = [];
  const now = new Date();
  for (let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString('en-US',{month:'short'}) });
  }
  return out;
}
function svgBarChart(months, values, color){
  const W = 560, H = 190, padL=44, padB=28, padT=14, padR=10;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const max = Math.max(1, ...values);
  const bw = innerW/months.length;
  const bars = months.map((m,idx)=>{
    const v = values[idx]||0;
    const h = max>0 ? (v/max)*innerH : 0;
    const x = padL + idx*bw + bw*0.18;
    const y = padT + innerH - h;
    const w = bw*0.64;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"><title>${m.label}: ${NPR(v)}</title></rect>
      <text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6B5544">${m.label}</text>`;
  }).join('');
  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH - f*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#E7DCC8" stroke-width="1"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#6B5544">${Math.round(max*f).toLocaleString('en-IN')}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${gridLines}${bars}</svg>`;
}
function svgGroupedBarChart(months, seriesA, seriesB, colorA, colorB){
  const W = 560, H = 190, padL=44, padB=28, padT=14, padR=10;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const max = Math.max(1, ...seriesA, ...seriesB);
  const bw = innerW/months.length;
  const bars = months.map((m,idx)=>{
    const va = seriesA[idx]||0, vb = seriesB[idx]||0;
    const ha = max>0 ? (va/max)*innerH : 0, hb = max>0 ? (vb/max)*innerH : 0;
    const groupX = padL + idx*bw + bw*0.12;
    const barW = bw*0.34;
    const xa = groupX, xb = groupX+barW+3;
    const ya = padT+innerH-ha, yb = padT+innerH-hb;
    return `<rect x="${xa.toFixed(1)}" y="${ya.toFixed(1)}" width="${barW.toFixed(1)}" height="${ha.toFixed(1)}" rx="2" fill="${colorA}"><title>आम्दानी ${m.label}: ${NPR(va)}</title></rect>
      <rect x="${xb.toFixed(1)}" y="${yb.toFixed(1)}" width="${barW.toFixed(1)}" height="${hb.toFixed(1)}" rx="2" fill="${colorB}"><title>खर्च ${m.label}: ${NPR(vb)}</title></rect>
      <text x="${(groupX+barW+1.5).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6B5544">${m.label}</text>`;
  }).join('');
  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH - f*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#E7DCC8" stroke-width="1"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#6B5544">${Math.round(max*f).toLocaleString('en-IN')}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${gridLines}${bars}</svg>`;
}

async function pageDashboard(c){
  const todayD = todayStr();
  const [{data:emp}, {data:inv}, {data:exp}, {data:inc}, {data:invStatus}, {data:items}, {data:attToday}] = await Promise.all([
    sb.from('employees').select('id,status'),
    sb.from('invoices').select('grand_total,invoice_date'),
    sb.from('expenses').select('amount,expense_date'),
    sb.from('income').select('amount,income_date'),
    sb.from('invoices').select('id,invoice_date,grand_total,payment_status,customers(name)').neq('payment_status','paid').order('invoice_date',{ascending:false}),
    sb.from('inventory_items').select('id,item_name,current_stock,reorder_level,unit'),
    sb.from('attendance').select('employee_id,status').eq('work_date', todayD),
  ]);
  const activeEmp = (emp||[]).filter(e=>e.status==='active').length;
  const monthKey = todayD.slice(0,7);
  const salesThis = (inv||[]).filter(i=>i.invoice_date?.startsWith(monthKey)).reduce((s,i)=>s+Number(i.grand_total||0),0);
  const expThis = (exp||[]).filter(i=>i.expense_date?.startsWith(monthKey)).reduce((s,i)=>s+Number(i.amount||0),0);
  const incThis = (inc||[]).filter(i=>i.income_date?.startsWith(monthKey)).reduce((s,i)=>s+Number(i.amount||0),0);

  // गत ६ महिनाको मासिक बिक्री
  const months = monthLabelsBack(6);
  const salesByMonth = months.map(m => (inv||[]).filter(i=>i.invoice_date?.startsWith(m.key)).reduce((s,i)=>s+Number(i.grand_total||0),0));
  const incByMonth = months.map(m => (inc||[]).filter(i=>i.income_date?.startsWith(m.key)).reduce((s,i)=>s+Number(i.amount||0),0)
    + (inv||[]).filter(i=>i.invoice_date?.startsWith(m.key)).reduce((s,i)=>s+Number(i.grand_total||0),0));
  const expByMonth = months.map(m => (exp||[]).filter(i=>i.expense_date?.startsWith(m.key)).reduce((s,i)=>s+Number(i.amount||0),0));

  // Low stock
  const lowStock = (items||[]).filter(i=>Number(i.current_stock||0) <= Number(i.reorder_level||0));

  // Outstanding payments
  const outstandingTotal = (invStatus||[]).reduce((s,i)=>s+Number(i.grand_total||0),0);

  // आज उपस्थित कर्मचारी
  const presentToday = (attToday||[]).filter(a=>a.status==='present').length;

  c.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:20px;">
      <div class="kpi"><div class="label">सक्रिय कर्मचारी</div><div class="value">${activeEmp}</div></div>
      <div class="kpi" style="border-top-color:var(--forest);"><div class="label">यस महिनाको बिक्री</div><div class="value">${NPR(salesThis)}</div></div>
      <div class="kpi" style="border-top-color:var(--amber);"><div class="label">यस महिनाको खर्च</div><div class="value">${NPR(expThis)}</div></div>
      <div class="kpi" style="border-top-color:var(--forest);"><div class="label">अन्य आम्दानी</div><div class="value">${NPR(incThis)}</div></div>
      <div class="kpi" style="border-top-color:var(--danger);"><div class="label">👷 आज उपस्थित</div><div class="value">${presentToday} / ${activeEmp}</div></div>
      <div class="kpi" style="border-top-color:var(--danger);"><div class="label">⚠️ बाँकी भुक्तानी</div><div class="value">${NPR(outstandingTotal)}</div></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); margin-bottom:20px;">
      <div class="card">
        <div class="section-title" style="font-size:15px;">📊 मासिक बिक्री (गत ६ महिना)</div>
        ${svgBarChart(months, salesByMonth, 'var(--wood)')}
      </div>
      <div class="card">
        <div class="section-title" style="font-size:15px;">📈 आम्दानी / खर्च तुलना</div>
        ${svgGroupedBarChart(months, incByMonth, expByMonth, 'var(--forest)', 'var(--danger)')}
        <div style="display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin-top:6px;">
          <div><span style="display:inline-block;width:10px;height:10px;background:var(--forest);border-radius:2px;margin-right:5px;"></span>आम्दानी</div>
          <div><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px;margin-right:5px;"></span>खर्च</div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));">
      <div class="card">
        <div class="section-title" style="font-size:15px;">📦 कम स्टक चेतावनी</div>
        ${lowStock.length ? `<table><thead><tr><th>सामान</th><th>मौज्दात</th><th>Reorder Level</th></tr></thead>
          <tbody>${lowStock.map(i=>`<tr><td>${i.item_name}</td><td><b>${i.current_stock}</b> ${i.unit||''}</td><td>${i.reorder_level||0}</td></tr>`).join('')}</tbody></table>`
          : `<div class="empty-state" style="padding:20px;">✅ सबै स्टक ठीक छ</div>`}
      </div>
      <div class="card">
        <div class="section-title" style="font-size:15px;">⚠️ बाँकी भुक्तानी (Outstanding)</div>
        ${(invStatus||[]).length ? `<table><thead><tr><th>मिति</th><th>ग्राहक</th><th>रकम</th><th>स्थिति</th></tr></thead>
          <tbody>${(invStatus||[]).slice(0,8).map(i=>`<tr><td>${i.invoice_date}</td><td>${i.customers?.name||'-'}</td><td><b>${NPR(i.grand_total)}</b></td>
            <td><span class="badge ${i.payment_status==='partial'?'badge-amber':'badge-red'}">${i.payment_status}</span></td></tr>`).join('')}</tbody></table>
          ${(invStatus||[]).length>8?`<div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">थप ${(invStatus||[]).length-8} वटा बाँकी बिल — बिजक पेजमा हेर्नुहोस्</div>`:''}`
          : `<div class="empty-state" style="padding:20px;">✅ कुनै बाँकी भुक्तानी छैन</div>`}
      </div>
    </div>`;
}

window.openEmployeeCalendar = (empId)=>{
  const now = new Date();
  renderEmployeeCalendar(empId, now.getMonth()+1, now.getFullYear())
    .catch(err=>{ console.error('openEmployeeCalendar error:', err); alert('क्यालेन्डर खोल्दा त्रुटि आयो: ' + (err.message||err)); });
};

window.renderEmployeeCalendar = async (empId, month, year)=>{
  const e = (state.employees||[]).find(x=>x.id===empId);
  if (!e){ alert('कर्मचारी फेला परेन। कृपया पेज पुनः लोड गरी फेरि प्रयास गर्नुहोस्।'); return; }
  const daysInMonth = new Date(year, month, 0).getDate();
  const from = `${year}-${String(month).padStart(2,'0')}-01`;
  const to = `${year}-${String(month).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
  const { data: att } = await sb.from('attendance').select('*').eq('employee_id', empId).gte('work_date', from).lte('work_date', to);
  const attMap = {}; (att||[]).forEach(a=>attMap[a.work_date]=a);

  const monthNames = ['जनवरी','फेब्रुअरी','मार्च','अप्रिल','मे','जुन','जुलाई','अगस्ट','सेप्टेम्बर','अक्टोबर','नोभेम्बर','डिसेम्बर'];
  const firstWeekday = new Date(year, month-1, 1).getDay(); // 0=आइत
  const statusColor = { present:'var(--forest)', absent:'var(--danger)', resigned:'var(--danger)', leave:'var(--amber)' };
  const statusLabel = { present:'उ', absent:'अ', resigned:'रा', leave:'बि' };

  let cells = '';
  for (let i=0;i<firstWeekday;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const onLeaveNow = isOnLeaveRange(e, ds);
    const a = attMap[ds];
    const st = a ? a.status : (onLeaveNow ? 'leave' : null);
    const bg = st ? statusColor[st] : 'transparent';
    const clickable = onLeaveNow && !a; // बिदा-अवधिमा (नटिकिएको भए) स्वतः हो, चाहेमा पनि Override गर्न मिल्ने
    cells += `<div onclick="selectCalDay('${empId}',${month},${year},'${ds}')" style="
        aspect-ratio:1; border:1px solid var(--line); border-radius:6px; cursor:pointer;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        font-size:12px; background:${st?bg:'#fff'}; color:${st?'#fff':'var(--ink)'};
        ${state._calSelectedDate===ds?'outline:2px solid var(--wood); outline-offset:1px;':''}">
        <div style="font-weight:700;">${d}</div>
        ${st ? `<div style="font-size:10px;">${statusLabel[st]}${onLeaveNow&&!a?'*':''}</div>` : ''}
      </div>`;
  }

  const selected = state._calSelectedDate;
  const selA = selected ? attMap[selected] : null;
  const selOnLeave = selected ? isOnLeaveRange(e, selected) : false;

  const body = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="calPrevMonth('${empId}',${month},${year})">←</button>
      <div style="font-weight:700;">${monthNames[month-1]} ${year}</div>
      <button class="btn btn-outline btn-sm" onclick="calNextMonth('${empId}',${month},${year})">→</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:11px; color:var(--ink-soft); text-align:center; margin-bottom:4px;">
      <div>आइत</div><div>सोम</div><div>मंगल</div><div>बुध</div><div>बिही</div><div>शुक्र</div><div>शनि</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">${cells}</div>
    <div style="font-size:11px; color:var(--ink-soft); margin-top:8px;">उ=उपस्थित, अ=अनुपस्थित, रा=राजिनामा, बि=अवकाश (* = बिदा-अवधिबाट स्वतः)</div>
    ${selected ? `
    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:8px;">${selected} को स्थिति ${selOnLeave&&!selA?'(हाल स्वतः अवकाश — चाहेमा तलको बटनले Override गर्न सकिन्छ)':''}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
        ${ATT_STATUSES.map(s=>`
          <button type="button" class="btn btn-sm ${(selA&&selA.status===s.key)?'btn-primary':'btn-outline'}"
            onclick="busy(this, ()=>tickCalAttendance('${empId}',${month},${year},'${selected}','${s.key}'))">${s.label}</button>
        `).join('')}
      </div>
      <div class="field" style="max-width:160px; margin:0;">
        <label>OT घण्टा</label>
        <input type="number" value="${selA?.overtime_hours||0}" onchange="updateOTCal('${empId}',${month},${year},'${selected}',this.value)"/>
      </div>
    </div>` : `<div style="font-size:12px; color:var(--ink-soft); margin-top:10px;">कुनै मितिमा क्लिक गर्नुहोस् — उपस्थित/अनुपस्थित/राजिनामा/अवकाश एकचोटी क्लिकमा सुरक्षित हुन्छ।</div>`}
  `;

  let wrap = document.getElementById('modal-backdrop');
  if (!wrap){
    wrap = document.createElement('div');
    wrap.className = 'modal-backdrop'; wrap.id = 'modal-backdrop';
    document.body.appendChild(wrap);
  }
  wrap.innerHTML = `<div class="modal" style="max-width:420px;">
    <h3>${e.full_name} — हाजिरी क्यालेन्डर</h3>
    <div id="modal-body">${body}</div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeEmployeeCalendar()">बन्द गर्नुहोस्</button></div>
  </div>`;
};
window.closeEmployeeCalendar = ()=>{ state._calSelectedDate = null; closeModal(); };
window.calPrevMonth = (empId,month,year)=>{
  state._calSelectedDate = null;
  month--; if (month<1){ month=12; year--; }
  renderEmployeeCalendar(empId, month, year);
};
window.calNextMonth = (empId,month,year)=>{
  state._calSelectedDate = null;
  month++; if (month>12){ month=1; year++; }
  renderEmployeeCalendar(empId, month, year);
};
window.selectCalDay = (empId,month,year,dateStr)=>{
  state._calSelectedDate = dateStr;
  renderEmployeeCalendar(empId, month, year);
};
window.tickCalAttendance = async (empId,month,year,dateStr,status)=>{

    { employee_id: empId, work_date: dateStr, status },

  await renderEmployeeCalendar(empId, month, year);
};
window.updateOTCal = async (empId,month,year,dateStr,hours)=>{

    { onConflict: 'employee_id,work_date' }
  );
  if (error){ alert(error.message); return; }
};

const ATT_STATUSES = [
  { key:'present',  label:'उपस्थित',  cls:'badge-green' },
  { key:'absent',   label:'अनुपस्थित', cls:'badge-red' },
  { key:'resigned', label:'राजिनामा', cls:'badge-red' },
  { key:'leave',    label:'अवकाश',   cls:'badge-amber' },
];

// कर्मचारी on_leave स्थितिमा छ र दिइएको मिति उसको बिदा-अवधि (status_date देखि status_date_to सम्म) भित्र पर्छ भने true फर्काउने
function isOnLeaveRange(emp, dateStr){
  if (!emp || emp.status !== 'on_leave' || !emp.status_date) return false;
  const to = emp.status_date_to || emp.status_date;
  return dateStr >= emp.status_date && dateStr <= to;
}

async function pageAttendance(c){
  const { data: emps } = await sb.from('employees').select('id,full_name,employee_code,status,status_date,status_date_to').in('status',['active','on_leave','resigned']);
  const date = c.dataset.date || todayStr();
  const { data: att } = await sb.from('attendance').select('*').eq('work_date', date);
  const attMap = {}; (att||[]).forEach(a=>attMap[a.employee_id]=a);

  c.innerHTML = `
   <div class="toolbar">
     <div class="field" style="max-width:200px; margin:0;"><input type="date" id="att-date" value="${date}" onchange="loadAttDate(this.value)"/></div>
     <div>
       <button class="btn btn-outline" onclick="openMonthlyAttendanceReport()">🖨️ मासिक प्रतिवेदन</button>
     </div>
   </div>
   <div class="card" style="margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);">
     ℹ️ कर्मचारीको लाइनमा उचित स्थिति (उपस्थित/अनुपस्थित/राजिनामा/अवकाश) मा एकपटक क्लिक गर्नुहोस् — त्यसै बेला सुरक्षित हुन्छ, छुट्टै Save गर्नु पर्दैन।
   </div>
   <div class="card">
    <table><thead><tr><th>ID</th><th>नाम</th><th>स्थिति (क्लिक गर्नुहोस्)</th><th>OT घण्टा</th></tr></thead>
    <tbody>
    ${(emps||[]).map(e=>{
      const a = attMap[e.id] || {};
      const current = a.status || null;
      const onLeaveNow = isOnLeaveRange(e, date);
      if (onLeaveNow){
        return `<tr data-emp="${e.id}">
          <td>${e.employee_code}</td><td>${e.full_name}</td>
          <td><span class="badge badge-amber">अवकाश (${e.status_date} देखि ${e.status_date_to||e.status_date} सम्म) — स्वतः गणना</span></td>
          <td>-</td>
        </tr>`;
      }
      return `<tr data-emp="${e.id}">
        <td>${e.employee_code}</td><td>${e.full_name}</td>
        <td>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${ATT_STATUSES.map(s=>`
            <button type="button" class="btn btn-sm ${current===s.key?'btn-primary':'btn-outline'}"
              onclick="busy(this, ()=>tickAttendance('${e.id}','${date}','${s.key}'))">${s.label}</button>
          `).join('')}
          </div>
        </td>
        <td><input type="number" class="att-ot" value="${a.overtime_hours||0}" style="width:70px" onchange="updateOT('${e.id}','${date}',this.value)"/></td>
      </tr>`;
    }).join('') || `<tr><td colspan="4" class="empty-state">कुनै सक्रिय कर्मचारी छैन</td></tr>`}
    </tbody></table>
   </div>`;
}

window.tickAttendance = async (employeeId, date, status)=>{
  const { error } = await sb.from('attendance').upsert(

    const daysInMonth = new Date(year, month, 0).getDate();
    const from = `${year}-${String(month).padStart(2,'0')}-01`;
    const to = `${year}-${String(month).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
    const { data: att } = await sb.from('attendance').select('*').gte('work_date',from).lte('work_date',to);
    const map = {}; (att||[]).forEach(a=>{ map[a.employee_id+'|'+a.work_date] = a.status; });
    const statusChar = { present:'P', absent:'A', resigned:'R', leave:'L', holiday:'—' };

    const dayHeaders = Array.from({length:daysInMonth},(_,i)=>`<th>${i+1}</th>`).join('');

      <div style="font-family:'Noto Sans Devanagari',sans-serif;">

window.generateSalaries = async (month, year, basis)=>{
  basis = basis || 'fixed30';
  document.getElementById('content').dataset.basis = basis;
  const divisor = (dim)=> basis==='actual' ? dim : 30;
  const { data: emps } = await sb.from('employees').select('*').in('status',['active','on_leave','resigned']);
  const { data: atts } = await sb.from('attendance').select('*')
    .gte('work_date', `${year}-${String(month).padStart(2,'0')}-01`)
    .lte('work_date', `${year}-${String(month).padStart(2,'0')}-31`);
  const { data: advances } = await sb.from('salary_advances').select('*').eq('settled', false);
  const daysInMonth = new Date(year, month, 0).getDate();
  const rows = (emps||[]).map(e=>{
    const my = (atts||[]).filter(a=>a.employee_id===e.id);
    const markedDates = new Set(my.map(a=>a.work_date));
    const presentDays = my.reduce((s,a)=> s + (a.status==='present'?1:0), 0);
    let unpaidDays = my.reduce((s,a)=> s + ((a.status==='absent'||a.status==='resigned'||a.status==='leave')?1:0), 0);
    // बिदा-अवधि (status_date देखि status_date_to सम्म) मा टिक नगरिएका दिनहरू पनि स्वतः अवकाश मानी गणना गर्ने
    for (let d=1; d<=daysInMonth; d++){
      const ds = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (!markedDates.has(ds) && isOnLeaveRange(e, ds)) unpaidDays += 1;
    }
    const otHours = my.reduce((s,a)=> s + Number(a.overtime_hours||0), 0);
    // मासिक तलब भएकालाई ३० दिन वा महिनाको वास्तविक दिन (छानिएको अनुसार) मानी day-wise दर निकाल्ने, अनुपस्थित/राजिनामा/अवकाशको दिन कटौती
    // दैनिक तलब भएकालाई उपस्थित दिनको मात्र भुक्तानी
    const dayRate = e.salary_rate / divisor(daysInMonth);
    const gross = e.salary_type==='daily'
      ? presentDays * e.salary_rate
      : Math.max(0, e.salary_rate - dayRate * unpaidDays);
    // PF/CIT/TDS स्वतः गणना (SALARY_RULES बाट)
    const pfAmt = Math.round(gross * SALARY_RULES.pf_employee_percent/100 * 100)/100;
    const citAmt = Math.round(gross * SALARY_RULES.cit_percent/100 * 100)/100;
    const tdsAmt = Math.round(gross * SALARY_RULES.tds_percent/100 * 100)/100;
    // बाँकी (unsettled) पेश्की भए यहीँ कटौती गर्ने
    const myAdvances = (advances||[]).filter(a=>a.employee_id===e.id);
    const advanceDue = myAdvances.reduce((s,a)=>s+Number(a.amount||0),0);
    const net = Math.round((gross - pfAmt - citAmt - tdsAmt - advanceDue)*100)/100;
    return {
      employee_id: e.id, month, year,
      present_days: presentDays, overtime_hours: otHours,
      gross_amount: Math.round(gross*100)/100,
      pf_amount: pfAmt, cit_amount: citAmt, tds_amount: tdsAmt,
      advance_deduction: advanceDue, bonus: 0,
      net_amount: net,
      payment_status: 'unpaid',
    };
  });
  if (!rows.length){ alert('सक्रिय कर्मचारी छैन'); return; }
  const { data: inserted, error } = await sb.from('salary_payments').upsert(rows, { onConflict:'employee_id,month,year' }).select();
  if (error){ alert(error.message + '\n\n(pf_amount/cit_amount/tds_amount/bonus columns थपिएको छ कि जाँच्नुहोस् — तलको SQL हेर्नुहोस्)'); return; }
  // प्रयोग भएका पेश्की settled मार्क गर्ने
  if ((advances||[]).length) await sb.from('salary_advances').update({ settled:true }).in('id', advances.map(a=>a.id));
  alert('तलब गणना भयो ✅'); render();
};

window.woodForm = (id)=>{
  const w = id ? state._woodPurchases.find(x=>x.id===id) : {};
  const body = `
   <div class="row">
    <div class="field"><label>आपूर्तिकर्ता</label><select id="w-supplier"><option value="">-- छान्नुहोस् --</option>${state._suppliers.map(s=>`<option value="${s.id}" ${w.supplier_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>प्रजाति (Species) *</label><input id="w-species" value="${w.species||''}" placeholder="साल / सिसौ / खयर"/></div>
   </div>
   <div class="row">
    <div class="field"><label>परिमाण (cft) *</label><input id="w-qty" type="number" value="${w.quantity||''}"/></div>
    <div class="field"><label>दर प्रति एकाइ *</label><input id="w-rate" type="number" value="${w.rate_per_unit||''}"/></div>
   </div>
   <div class="row">
    <div class="field"><label>Permit / Release No.</label><input id="w-permit" value="${w.permit_no||''}"/></div>
    <div class="field"><label>गाडी नं.</label><input id="w-vehicle" value="${w.vehicle_no||''}"/></div>
   </div>
   <div class="field"><label>खरिद मिति</label><input id="w-date" type="date" value="${w.purchase_date||todayStr()}"/></div>
   ${id?`<div class="msg" style="background:#F7E7D3; color:var(--amber);">⚠️ सम्पादन गर्दा स्टक परिमाण स्वतः मिलाइनेछ (पुरानो घटाई नयाँ थपेर)।</div>`:''}`;
  openModal(id ? 'काठ खरिद सम्पादन' : 'काठ खरिद Entry', body, async ()=>{
    const species = document.getElementById('w-species').value.trim();
    const qty = Number(document.getElementById('w-qty').value||0);
    const rate = Number(document.getElementById('w-rate').value||0);
    if (!species || !qty || !rate){ alert('प्रजाति, परिमाण, दर आवश्यक'); return; }
    const payload = {
      supplier_id: document.getElementById('w-supplier').value || null,
      species, quantity: qty, rate_per_unit: rate,
      permit_no: document.getElementById('w-permit').value,
      vehicle_no: document.getElementById('w-vehicle').value,
      purchase_date: document.getElementById('w-date').value || todayStr(),
    };
    let wp;
    if (id){
      // पुरानो inventory प्रवेश हटाएर, अपडेट पछि नयाँ परिमाणको प्रवेश थप्ने
      await sb.from('inventory_transactions').delete().eq('reference_type','wood_purchase').eq('reference_id', id);
      const { data, error } = await sb.from('wood_purchases').update(payload).eq('id', id).select().single();
      if (error){ alert(error.message); return; }
      wp = data;
    } else {
      const { data, error } = await sb.from('wood_purchases').insert(payload).select().single();
      if (error){ alert(error.message); return; }
      wp = data;
    }
    // inventory item find-or-create, then log entry transaction
    let { data: item } = await sb.from('inventory_items').select('*').eq('item_name', species).maybeSingle();
    if (!item){
      const { data: newItem, error: ie } = await sb.from('inventory_items').insert({ item_name: species, item_type:'raw_wood', unit:'cft' }).select().single();
      if (ie){ alert(ie.message); return; }
      item = newItem;
    }
    await sb.from('inventory_transactions').insert({
      item_id: item.id, txn_type:'entry', quantity: qty,
      reference_type:'wood_purchase', reference_id: wp.id, txn_date: wp.purchase_date,
      remarks: `खरिद: ${wp.purchase_no}`,
    });
    closeModal(); render();
  });
};

window.issueInvoice = async (id)=>{
  if (!confirm('बिल जारी गर्नुभएपछि यो आधिकारिक बीजक मानिनेछ र आम्दानीमा रकम थपिनेछ। अगाडि बढ्ने?')) return;
  const { data: inv, error } = await sb.from('invoices').update({ status:'issued', issued_at: new Date().toISOString() }).eq('id', id).select().single();
  if (error){ alert('जारी गर्न सकिएन: ' + error.message + '\n\n(schema_update_3.sql RUN गर्नुभएको छ कि छैन जाँच्नुहोस्।)'); return; }
  const { data: existingIncome } = await sb.from('income').select('id').eq('invoice_id', id).maybeSingle();
  if (!existingIncome){
    await sb.from('income').insert({ source:'Sales Invoice '+inv.invoice_no, category:'sales', amount: inv.grand_total, income_date: inv.invoice_date, invoice_id: inv.id });
  }
  render();
};

       <option value="cheque">🧾 चेक</option>
     </select>
   </div>
   <div id="ip-qr-wrap" style="display:none; text-align:center; margin:10px 0;"></div>
   <div class="row">
    <div class="field"><label>प्राप्त रकम *</label><input id="ip-amount" type="number" value="${due}"/></div>
    <div class="field"><label>मिति</label><input id="ip-date" type="date" value="${todayStr()}"/></div>
   </div>
   <div class="field"><label>सन्दर्भ नं. (वैकल्पिक)</label><input id="ip-ref" placeholder="Txn ID / चेक नं."/></div>
   <div style="font-size:12px; color:var(--ink-soft);">बाँकी रकम: <b>${NPR(due)}</b></div>`;
  openModal('बिल भुक्तानी लिनुहोस्', body, async ()=>{
    const amt = Number(document.getElementById('ip-amount').value||0);
    if (!amt){ alert('रकम आवश्यक'); return; }
    const newPaid = Number(inv.paid_amount||0) + amt;
    const status = newPaid >= Number(inv.grand_total) ? 'paid' : (newPaid>0 ? 'partial' : 'unpaid');
    const { error } = await sb.from('invoices').update({
      paid_amount: newPaid, payment_status: status,
      payment_method: document.getElementById('ip-method').value,
      payment_reference: document.getElementById('ip-ref').value,
      paid_date: document.getElementById('ip-date').value || todayStr(),
    }).eq('id', id);
    if (error){ alert(error.message + '\n\n(schema_update_4.sql RUN गर्नुभएको छ कि जाँच्नुहोस्)'); return; }
    closeModal(); render();
  });
  await toggleQrPreview();
};
window.toggleQrPreview = async ()=>{
  const method = document.getElementById('ip-method')?.value;
  const wrap = document.getElementById('ip-qr-wrap');
  if (!wrap) return;
  if (method==='qr'){
    wrap.style.display='';
    const url = await makeQrDataUrl(`Pay ${COMPANY.name} | To: ${COMPANY.payment_qr_text}`, 130);
    wrap.innerHTML = url ? `<img src="${url}" style="width:130px;height:130px;"/><div style="font-size:11px; margin-top:4px;">ग्राहकलाई यो QR स्क्यान गर्न दिनुहोस्</div>` : '';
  } else { wrap.style.display='none'; }
};

window.editInvoiceForm = async (id)=>{
  const inv = state._invoices.find(x=>x.id===id);
  if (inv.locked){ alert('यो बिल Locked छ — पहिले Unlock गर्नुहोस्।'); return; }
  const { data: items } = await sb.from('invoice_items').select('*').eq('invoice_id', id);
  const body = `
   <div class="field"><label>ग्राहक</label>

   </div>
   <div id="inv-items">
     ${(items||[]).map(it=>`
     <div class="row inv-item-row">
       <div class="field" style="flex:2"><label>विवरण</label><input class="ii-desc" value="${it.description||''}"/></div>

  openModal('बिल सम्पादन', body, async ()=>{
    const rows = [...document.querySelectorAll('.inv-item-row')].map(r=>({
      description: r.querySelector('.ii-desc').value,
      quantity: Number(r.querySelector('.ii-qty').value||0),

      <tr>
        <td style="text-align:center">${idx+1}</td>
        <td>${it.description||''}</td>
        <td style="text-align:center">${it.quantity}</td>
        <td style="text-align:right">${Number(it.unit_price).toLocaleString('en-IN')}</td>
        <td style="text-align:right">${Number(it.line_total).toLocaleString('en-IN')}</td>
      </tr>`).join('');
    document.getElementById('print-area').innerHTML = `

--------------------------------------------------------------------- */
function periodRange(kind, refDate){
  const d = new Date(refDate);
  if (kind==='daily') return { from: refDate, to: refDate, label: refDate };
  if (kind==='yearly'){
    const y = d.getFullYear();
    return { from:`${y}-01-01`, to:`${y}-12-31`, label:`वर्ष ${y}` };
  }
  const y = d.getFullYear(), m = d.getMonth();
  const from = new Date(y,m,1).toISOString().slice(0,10);
  const to = new Date(y,m+1,0).toISOString().slice(0,10);
  return { from, to, label: `${['जन','फेब','मार्च','अप्रिल','मे','जुन','जुल','अग','सेप','अक्टो','नोभ','डिसे'][m]} ${y}` };
}

window.exportReportExcel = async ()=>{
  const c = document.getElementById('content');
  const kind = c.dataset.rkind||'monthly', refDate = c.dataset.rdate||todayStr();
  const range = periodRange(kind, refDate);
  const [{data:inv},{data:exp},{data:inc}] = await Promise.all([
    sb.from('invoices').select('invoice_no,invoice_date,grand_total,vat_amount,payment_status').gte('invoice_date',range.from).lte('invoice_date',range.to).neq('status','cancelled'),

    sb.from('income').select('income_date,source,category,amount').gte('income_date',range.from).lte('income_date',range.to),
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inv||[]), 'Invoices');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exp||[]), 'Expenses');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inc||[]), 'Income');

};

async function pageRolesUsers(c){
  if (!canDo('settings_roles','view')){ c.innerHTML = `<div class="msg msg-error">अनुमति छैन।</div>`; return; }
  const [{ data: roles, error: rErr }, { data: users, error: uErr }] = await Promise.all([
    sb.from('roles').select('*').order('created_at'),
    sb.from('user_profiles').select('*, roles(key,label_ne,label_en)').order('created_at'),
  ]);
  if (rErr || uErr){
    c.innerHTML = `<div class="msg msg-error">Phase 1 SQL (roles/permissions) अझै migrate भएको छैन। कृपया phase1_foundation.sql Supabase मा चलाउनुहोस्।<br><small>${(rErr||uErr).message}</small></div>`;
    return;
  }
  state.__roles = roles;
  c.innerHTML = `
    <div class="toolbar">
      <div class="section-title" style="margin:0;">प्रयोगकर्ता र भूमिका (Users &amp; Roles)</div>
      ${canDo('settings_roles','edit') ? `<button class="btn btn-primary" onclick="adminCreateUserForm()">+ नयाँ प्रयोगकर्ता थप्नुहोस्</button>` : ''}
    </div>
    <div class="card" style="margin-bottom:18px;">
      <div class="section-title" style="font-size:15px;">प्रयोगकर्ताहरू (Users)</div>
      <table>
        <thead><tr><th>इमेल</th><th>पूरा नाम</th><th>भूमिका</th><th>सक्रिय</th><th>अन्तिम लगइन</th><th>कार्य</th></tr></thead>
        <tbody>
          ${(users||[]).map(u => `
            <tr>
              <td>${u.id === state.user.id ? '<b>' + (u.full_name||'—') + ' (तपाईं)</b>' : (u.full_name||'—')}</td>
              <td>${u.full_name||'—'}</td>
              <td>
                <select ${!canDo('settings_roles','edit') ? 'disabled' : ''} onchange="changeUserRole('${u.id}', this.value)">

              </td>
              <td>${u.is_active ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-red">Inactive</span>'}</td>
              <td>${u.last_login ? new Date(u.last_login).toLocaleString('en-IN') : '—'}</td>

                <button class="btn btn-sm btn-outline" onclick="toggleUserActive('${u.id}', ${!u.is_active})">${u.is_active?'Deactivate':'Activate'}</button>

        </tbody>
      </table>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-top:10px;">माथिको "+ नयाँ प्रयोगकर्ता थप्नुहोस्" बाट Admin ले सिधै खाता बनाउन सक्छ (भूमिका छानेर)। अथवा प्रयोगकर्ता आफै Login पृष्ठबाट "नयाँ खाता बनाउनुहोस्" गर्न सक्छन् — तिनीहरू default भूमिकामा यहाँ स्वतः देखिन्छन्।</div>
    </div>
    <div class="card">
      <div class="section-title" style="font-size:15px;">भूमिका अनुसार अनुमति (Permissions per Role)</div>
      <div class="row" style="margin-bottom:12px;">
        <div class="field" style="max-width:260px;">
          <label>भूमिका छान्नुहोस्</label>

          </select>

window.onAdminUserEmpChange = ()=>{
  const val = document.getElementById('au-emp').value;
  document.getElementById('au-name-wrap').style.display = (val === '__other__') ? '' : 'none';
};
window.adminCreateUserForm = async ()=>{
  if (!canDo('settings_roles','edit')){ toast('अनुमति छैन', 'error'); return; }
  const roles = state.__roles || [];
  const { data: emps } = await sb.from('employees').select('id,full_name,phone').order('full_name');
  state.__empsForUser = emps||[];
  const body = `
   <div class="field"><label>कर्मचारी छान्नुहोस् *</label>
     <select id="au-emp" onchange="onAdminUserEmpChange()">
       <option value="">-- छान्नुहोस् --</option>
       ${(emps||[]).map(e=>`<option value="${e.id}">${e.full_name}${e.phone?' — '+e.phone:''}</option>`).join('')}
       <option value="__other__">✍️ अन्य (सूचीमा नभएको व्यक्ति)</option>
     </select>
   </div>
   <div class="field" id="au-name-wrap" style="display:none;"><label>पूरा नाम *</label><input id="au-name"/></div>
   <div class="field"><label>इमेल *</label><input id="au-email" type="email" placeholder="you@example.com"/></div>
   <div class="field"><label>अस्थायी पासवर्ड *</label><input id="au-pass" type="text" placeholder="कम्तिमा ६ अक्षर"/>
     <div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">यो पासवर्ड प्रयोगकर्तालाई सिधै भन्नुहोस् — पछि उनीहरू आफै बदल्न सक्छन्।</div>
   </div>
   <div class="field"><label>भूमिका *</label>
     <select id="au-role">${roles.map(r=>`<option value="${r.id}">${r.label_ne} (${r.label_en})</option>`).join('')}</select>
   </div>
   <div class="msg" style="background:#F7E7D3; color:var(--amber);">ℹ️ यो सुविधा प्रयोग गर्न Supabase मा "admin-create-user" नामको Edge Function डिप्लोय भएको हुनुपर्छ (साथैको admin-create-user.ts फाइल हेर्नुहोस्)।</div>`;
  openModal('नयाँ प्रयोगकर्ता थप्नुहोस्', body, async ()=>{
    const empSel = document.getElementById('au-emp').value;
    let full_name = '';
    if (empSel === '__other__'){
      full_name = document.getElementById('au-name').value.trim();
    } else if (empSel) {
      const emp = state.__empsForUser.find(e=>e.id===empSel);
      full_name = emp?.full_name || '';
    }
    const email = document.getElementById('au-email').value.trim();
    const password = document.getElementById('au-pass').value;
    const role_id = document.getElementById('au-role').value;
    if (!empSel){ alert('कर्मचारी छान्नुहोस् वा "अन्य" रोज्नुहोस्'); return; }
    if (!full_name || !email || !password || password.length<6){ alert('सबै फिल्ड भर्नुहोस् (पासवर्ड कम्तिमा ६ अक्षर)'); return; }
    const { data, error } = await sb.functions.invoke('admin-create-user', {
      body: { email, password, full_name, role_id },
    });
    if (error || data?.error){
      alert('प्रयोगकर्ता बनाउन सकिएन: ' + (data?.error || error.message) + '\n\n(admin-create-user Edge Function Supabase मा डिप्लोय भएको छ कि जाँच्नुहोस्।)');
      return;
    }
    closeModal(); toast('प्रयोगकर्ता सफलतापूर्वक बनियो ✅'); render();
  });
};
window.changeUserRole = async (userId, roleId)=>{
  if (!canDo('settings_roles','edit')){ toast('अनुमति छैन', 'error'); return; }
  const { error } = await sb.from('user_profiles').update({ role_id: roleId }).eq('id', userId);
  if (error){ toast('असफल: ' + error.message, 'error'); return; }
  logAudit('update', 'settings_roles', userId, { changed: 'role_id', new_role_id: roleId });
  toast('भूमिका अपडेट भयो');
  render();
};
window.toggleUserActive = async (userId, newVal)=>{
  if (!canDo('settings_roles','edit')){ toast('अनुमति छैन', 'error'); return; }
  const { error } = await sb.from('user_profiles').update({ is_active: newVal }).eq('id', userId);
  if (error){ toast('असफल: ' + error.message, 'error'); return; }
  logAudit('update', 'settings_roles', userId, { changed: 'is_active', new_value: newVal });
  toast(newVal ? 'सक्रिय गरियो' : 'निष्क्रिय गरियो');
  render();
};
const PERM_MODULES = [
  ['dashboard','ड्यासबोर्ड'], ['employees','कर्मचारी'], ['attendance','हाजिरी'], ['salary','तलब'],
  ['suppliers','आपूर्तिकर्ता'], ['wood','काठ खरिद'], ['inventory','स्टक'], ['machinery','मेसिनरी'],
  ['customers','ग्राहक'], ['invoices','बिल'], ['income','आम्दानी'], ['expenses','खर्च'], ['reports','प्रतिवेदन'],
  ['manufacturing','उत्पादन (Manufacturing)'], ['work_orders','कार्य आदेश'], ['barcode','Barcode/QR'],
  ['purchase','खरिद'], ['supplier_ledger','आपूर्तिकर्ता खाता'], ['crm','ग्राहक CRM'], ['accounting','लेखा'],
  ['analytics','Analytics'], ['delivery','डेलिभरी'], ['files','फाइल'],
  ['settings_roles','प्रयोगकर्ता/भूमिका'], ['audit_log','Audit Log'], ['backup','Backup'],
];
window.loadPermMatrix = async (roleId)=>{
  const box = document.getElementById('perm-matrix');
  const sel = document.getElementById('perm-role-select');
  if (sel) sel.value = roleId;
  const { data: perms, error } = await sb.from('permissions').select('*').eq('role_id', roleId);
  if (error){ box.innerHTML = `<div class="msg msg-error">${error.message}</div>`; return; }
  const map = {}; (perms||[]).forEach(p=>{ map[p.module_key]=p; });
  const actions = ['view','create','edit','delete','export','print'];
  box.innerHTML = `
    <table>
      <thead><tr><th>Module</th>${actions.map(a=>`<th style="text-align:center;">${a}</th>`).join('')}</tr></thead>
      <tbody>
        ${PERM_MODULES.map(([key,label])=>{
          const p = map[key] || {};
          return `<tr>
            <td>${label}</td>
            ${actions.map(a => `<td style="text-align:center;">
              <input type="checkbox" ${p['can_'+a] ? 'checked':''} ${!canDo('settings_roles','edit')?'disabled':''}
                onchange="togglePerm('${roleId}','${key}','${a}',this.checked)"/>
            </td>`).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
};
window.togglePerm = async (roleId, moduleKey, action, checked)=>{
  if (!canDo('settings_roles','edit')){ toast('अनुमति छैन', 'error'); return; }
  const field = 'can_' + action;
  const { error } = await sb.from('permissions')
    .upsert({ role_id: roleId, module_key: moduleKey, [field]: checked }, { onConflict: 'role_id,module_key' });
  if (error){ toast('असफल: ' + error.message, 'error'); return; }
  logAudit('update', 'settings_roles', roleId, { module_key: moduleKey, [field]: checked });
  toast('अनुमति अपडेट भयो', 'ok', 1500);
};
