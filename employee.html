<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Employee Tracking Client - Background GPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="capacitor.js"></script>
    
    <style>
        button:active { transform: scale(0.98); }
        .pulse-emerald {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-geo 2s infinite;
        }
        @keyframes pulse-geo {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex items-center justify-center min-h-screen p-4 select-none">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col justify-between min-h-[85vh] sm:min-h-0">
        
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 p-6 text-center text-white relative shadow-md">
            <div class="absolute top-4 right-4 flex items-center gap-1.5 bg-black/25 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm">
                <span id="sync-dot" class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                <span id="sync-text">Offline</span>
            </div>
            <i class="fa-solid fa-location-crosshairs text-4xl mb-2 drop-shadow-md"></i>
            <h1 class="text-2xl font-bold tracking-tight">Staff GPS Tracker</h1>
            <p class="text-xs text-emerald-100 mt-1">Background Persistent Tracking Active</p>
        </div>

        <div class="p-6 space-y-6 flex-1 flex flex-col justify-center">
            
            <div id="login-form-box" class="space-y-5 w-full">
                <div class="bg-slate-700/40 p-5 rounded-xl border border-slate-600/60 shadow-inner">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Enter Employee ID / Code</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-id-card text-lg"></i>
                        </span>
                        <input type="text" id="emp-code-input" class="w-full bg-slate-900 border border-slate-600 rounded-xl pl-11 pr-4 py-3.5 text-white text-lg placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-mono tracking-wide uppercase transition-all" placeholder="e.g. EMP-101">
                    </div>
                </div>
                <button onclick="verifyAndStart()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2.5 text-lg cursor-pointer">
                    <i class="fa-solid fa-play text-base"></i> फिल्ड कार्य/कार्यालय बाहिरको काम शुरु गर्ने
                </button>
            </div>

            <div id="tracking-dashboard" class="hidden space-y-5 w-full">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-700 text-center shadow-md">
                        <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Duty Status</p>
                        <p class="text-emerald-400 font-bold text-base mt-1 flex items-center justify-center gap-1.5">
                            <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-ping"></span> BACKGROUND ON
                        </p>
                    </div>
                    <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-700 text-center shadow-md">
                        <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Device Battery</p>
                        <p id="battery-display" class="text-slate-200 font-bold text-base mt-1"><i class="fa-solid fa-battery-three-quarters text-slate-400 mr-1"></i> 100%</p>
                    </div>
                </div>

                <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700/80 font-mono text-sm space-y-3 shadow-inner backdrop-blur-sm">
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Employee:</span>
                        <span id="lbl-emp-identity" class="text-slate-200 font-bold">---</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Latitude:</span>
                        <span id="lbl-lat" class="text-emerald-400 font-bold">0.000000</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Longitude:</span>
                        <span id="lbl-lng" class="text-emerald-400 font-bold">0.000000</span>
                    </div>
                    <div class="flex justify-between pt-1">
                        <span class="text-slate-400">Last Pushed:</span>
                        <span id="lbl-time" class="text-slate-300 bg-slate-800 px-2 py-0.5 rounded text-xs">Never</span>
                    </div>
                </div>

                <button onclick="stopTracking()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-4 rounded-xl flex items-center justify-center gap-2 text-lg shadow-lg shadow-rose-600/10 cursor-pointer">
                    <i class="fa-solid fa-stop"></i> फिल्ड वा कार्यालय बाहिरको काम सकेर कार्यालय फर्कि सक्नु भयो।
                </button>
            </div>

            <div id="offline-buffer-alert" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-xl p-3.5 text-center animate-pulse">
                <p class="text-xs text-amber-400 font-medium">
                    <i class="fa-solid fa-cloud-arrow-up mr-1 text-sm"></i> Connection weak. Saving logs locally...
                </p>
            </div>

        </div>

        <div class="p-4 border-t border-slate-700/40 text-center text-[11px] text-slate-500 bg-slate-900/30 font-mono">
            Background Service: Verified Secure
        </div>
    </div>

    <script>
        // --- SUPABASE SETUP ---
        const SUPABASE_URL = "https://fsoltknfkwptcrsmvjlh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PIXaEa6gmVIa8vWPRzhq1A_zY7o-AoT";
        let supabaseClient = null;
        let employeeCode = "";
        let offlineQueue = [];
        let isTrackingActive = false;

        document.addEventListener("DOMContentLoaded", () => {
            initSupabase();
            checkSavedSession();
            window.addEventListener('online', syncOfflineData);
            window.addEventListener('offline', () => updateNetworkStatus(false));
        });

        function initSupabase() {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                updateNetworkStatus(navigator.onLine);
            } catch (e) { console.error(e); }
        }

        function updateNetworkStatus(isOnline) {
            const dot = document.getElementById('sync-dot');
            const txt = document.getElementById('sync-text');
            if(!dot || !txt) return;
            if(isOnline) {
                dot.className = "h-2 w-2 rounded-full bg-emerald-400 pulse-emerald";
                txt.innerText = "Connected";
                syncOfflineData();
            } else {
                dot.className = "h-2 w-2 rounded-full bg-amber-500 animate-pulse";
                txt.innerText = "Offline Mode";
            }
        }

        function checkSavedSession() {
            const savedCode = localStorage.getItem('active_emp_code');
            if(savedCode) {
                document.getElementById('emp-code-input').value = savedCode;
                verifyAndStart();
            }
        }

        async function verifyAndStart() {
            const inputField = document.getElementById('emp-code-input');
            employeeCode = inputField.value.trim().toUpperCase();

            if(!employeeCode) { alert("कृपया ID राख्नुहोस्!"); return; }
            if(!supabaseClient) { alert("नेटवर्क समस्या!"); return; }

            const { data, error } = await supabaseClient.from('employees').select('name').eq('emp_code', employeeCode).single();
            if (error || !data) {
                alert("यो ID फेला परेन!");
                return;
            }

            localStorage.setItem('active_emp_code', employeeCode);
            document.getElementById('lbl-emp-identity').innerText = `${data.name} (${employeeCode})`;
            document.getElementById('login-form-box').classList.add('hidden');
            document.getElementById('tracking-dashboard').classList.remove('hidden');

            // वास्तविक ब्याकग्राउन्ड ट्र्याकिङ सुरु गर्ने
            startBackgroundTracking();
        }

        // --- महत्वपूर्ण: क्यापासिटर ब्याकग्राउन्ड जियोलोकेसन इन्जिन ---
        function startBackgroundTracking() {
            isTrackingActive = true;
            
            // यदि एप मोबाइलमा कन्भर्ट भइसकेको छ भने 'Capacitor' एक्टिभ हुन्छ
            if (window.Capacitor && window.Capacitor.Plugins.BackgroundGeolocation) {
                const BackgroundGeolocation = window.Capacitor.Plugins.BackgroundGeolocation;

                // ब्याकग्राउन्ड कन्फिगरेशन (स्क्रिन बन्द हुँदा पनि ब्याकग्राउन्डमा कति समयमा ट्र्याक गर्ने)
                BackgroundGeolocation.addWatcher({
                    backgroundMessage: "तपाईंको लोकेसन  ट्र्याक भइरहेको छ।",
                    backgroundTitle: "Staff Tracker Active",
                    requestPermissions: true,
                    stale: false,
                    distanceFilter: 10 // प्रत्येक १० मिटरको दुरी पार गर्दा मात्र डाटा पठाउने (ब्याट्री बचाउन)
                }, function(location, error) {
                    if (error) {
                        console.error(error);
                        return;
                    }
                    if (location) {
                        processIncomingCoords(location.latitude, location.longitude);
                    }
                });
            } else {
                // यदि मोबाइल एपमा कन्भर्ट नगरी सिधै ब्राउजरमा मात्र चलाएमा साधारण Geolocation चल्छ (यो ब्याकग्राउन्डमा रोकिन सक्छ)
                console.warn("Running in standard browser mode. Install APK for true background tracking.");
                navigator.geolocation.watchPosition((pos) => {
                    if(isTrackingActive) processIncomingCoords(pos.coords.latitude, pos.coords.longitude);
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function processIncomingCoords(lat, lng) {
            document.getElementById('lbl-lat').innerText = lat.toFixed(6);
            document.getElementById('lbl-lng').innerText = lng.toFixed(6);
            document.getElementById('lbl-time').innerText = new Date().toLocaleTimeString();

            const payload = {
                emp_code: employeeCode,
                latitude: lat,
                longitude: lng,
                battery_level: 100,
                created_at: new Date().toISOString()
            };

            if(navigator.onLine) {
                transmitToSupabase(payload);
            } else {
                offlineQueue.push(payload);
                localStorage.setItem('offline_gps_logs', JSON.stringify(offlineQueue));
                document.getElementById('offline-buffer-alert').classList.remove('hidden');
            }
        }

        async function transmitToSupabase(payload) {
            try {
                await supabaseClient.from('location_logs').insert([payload]);
                await supabaseClient.from('latest_locations').upsert({
                    emp_code: payload.emp_code,
                    latitude: payload.latitude,
                    longitude: payload.longitude,
                    updated_at: payload.created_at
                }, { onConflict: 'emp_code' });
                updateNetworkStatus(true);
            } catch (e) {
                updateNetworkStatus(false);
            }
        }

        async function syncOfflineData() {
            const localData = localStorage.getItem('offline_gps_logs');
            if(!localData) return;
            offlineQueue = JSON.parse(localData);
            while(offlineQueue.length > 0) {
                await transmitToSupabase(offlineQueue[0]);
                offlineQueue.shift();
                localStorage.setItem('offline_gps_logs', JSON.stringify(offlineQueue));
            }
            document.getElementById('offline-buffer-alert').classList.add('hidden');
        }

        function stopTracking() {
            isTrackingActive = false;
            localStorage.removeItem('active_emp_code');
            alert("ड्युटी बन्द भयो। ब्याकग्राउन्ड ट्र्याकिङ रोकियो।");
            window.location.reload();
        }
    </script>
</body>
</html>
