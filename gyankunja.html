<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ज्ञानकुञ्ज - लगइन तथा दर्ता</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --bg-overlay: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('Brain-power.avif') no-repeat center center fixed;
            background-size: cover; color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 15px;
        }
        .login-container {
            width: 100%; max-width: 400px;
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 30px; border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 0.9rem; color: #38bdf8; font-weight: 600; }
        
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 45px; }
        .toggle-password-btn {
            position: absolute; right: 12px; background: none; border: none; cursor: pointer;
            padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); width: auto;
        }
        .toggle-password-btn:hover { color: white; }
        .toggle-password-btn svg { width: 20px; height: 20px; fill: currentColor; }

        input {
            width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-action { background: var(--primary); color: white; margin-top: 10px; }
        .btn-action:hover { background: #0284c7; }
        .btn-toggle { background: transparent; color: #38bdf8; text-decoration: underline; margin-top: 15px; font-size: 0.9rem; cursor: pointer;}
        .contact-box { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-muted); }
        .contact-box a { color: #f59e0b; text-decoration: none; font-weight: bold; }
        .toggle-section { display: none; }
        .toggle-section.active { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-container">
    <div id="loginSection" class="toggle-section active">
        <h2>🔐 ज्ञानकुञ्ज लगइन</h2>
        <div class="form-group">
            <label>इमेल (Email)</label>
            <input type="email" id="loginEmail" placeholder="तपाईंको दर्ता भएको इमेल">
        </div>
        <div class="form-group">
            <label>पासवर्ड (Password)</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="तपाईंको पासवर्ड">
                <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
        </div>
        <button class="btn-action" onclick="handleLogin()">Sign In (लगइन गर्नुहोस्)</button>
        <button class="btn-toggle" onclick="toggleForm('register')">नयाँ खाता खोल्नुहोस् (Register)</button>
    </div>

    <div id="registerSection" class="toggle-section">
        <h2>👤 नयाँ खाता सिर्जना</h2>
        <div class="form-group">
            <label>पूरा नाम (Full Name)</label>
            <input type="text" id="regName" placeholder="तपाईंको पूरा नाम">
        </div>
        <div class="form-group">
            <label>इमेल (Email)</label>
            <input type="email" id="regEmail" placeholder="उदाहरण: user@email.com">
        </div>
        <div class="form-group">
            <label>पासवर्ड (Password)</label>
            <div class="password-wrapper">
                <input type="password" id="regPassword" placeholder="कम्तीमा ६ अक्षरको पासवर्ड">
                <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
        </div>
        <button class="btn-action" style="background:var(--success);" onclick="handleSignUp()">दर्ता गर्नुहोस् (Sign Up)</button>
        <button class="btn-toggle" onclick="toggleForm('login')">पहिले नै खाता छ? लगइन गर्नुहोस्</button>
    </div>

    <div class="contact-box">
        🔑 Password विर्सिनु भयो? <br>
        <strong>Contact Us:</strong> <a href="tel:9857626542">9857626542</a>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://slsxseiawrayselbnorg.supabase.co', 'sb_publishable_BhbSNg9iAGBB6dV5J3CZaw_xyGi-fYq');

    function togglePasswordVisibility(inputId, btnElement) {
        const passwordInput = document.getElementById(inputId);
        const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeClosedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.01-.17c0-1.66-1.34-3-3-3l-.16.02z";
        const svgPath = btnElement.querySelector('path');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            svgPath.setAttribute('d', eyeClosedPath);
        } else {
            passwordInput.type = 'password';
            svgPath.setAttribute('d', eyeOpenPath);
        }
    }

    function toggleForm(type) {
        document.querySelectorAll('.toggle-section').forEach(s => s.classList.remove('active'));
        if(type === 'register') {
            document.getElementById('registerSection').classList.add('active');
        } else {
            document.getElementById('loginSection').classList.add('active');
        }
    }

    // नयाँ दर्ता फङ्सन - बिना पपअप सिधै लगइन फारम खुल्ने
    async function handleSignUp() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if(!name || !email || !password) { return; }
        if(password.length < 6) { return; }

        try {
            const { data: checkUser } = await supabaseClient.from('profiles').select('email').eq('email', email);
            if (checkUser && checkUser.length > 0) { return; }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email, password: password,
                options: { data: { name: name, role: 'Normal', password: password } }
            });

            if (error) throw error;
            
            // दर्ता भएपछि बिना म्यासेज सिधै लगइन फारम खोल्दिने
            document.getElementById('regName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            toggleForm('login');

        } catch (error) {
            console.error(error);
        }
    }

    // लगइन फङ्सन - बिना पपअप सिधै ड्यासबोर्ड वा पोर्टल खुल्ने
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if(!email || !password) { return; }

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
            if (error) throw error;

            const user = data.user;
            const { data: profile, error: profError } = await supabaseClient.from('profiles').select('role, status').eq('id', user.id).single();

            if (profError) {
                window.location.href = 'index.html';
                return;
            }

            if(profile && profile.status === 'Inactive') {
                await supabaseClient.auth.signOut();
                return;
            }

            // बिना कुनै अलर्ट सिधै पेज खुल्छ
            if (profile && profile.role === 'Admin') {
                window.location.href = 'admin22.html';
            } else {
                window.location.href = 'index11.html';
            }

        } catch (error) {
            alert("इमेल वा पासवर्ड गलत भयो!"); // गलत पासवर्ड हाल्दा मात्र सूचना आउनेछ
        }
    }
</script>
</body>
</html>
