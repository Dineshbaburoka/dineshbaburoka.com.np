<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>गलकोट नगरपालिकाको कर्मचारी परिचयपत्र</title>
<!--
  ✦ How this works
  - On screen: Flip-able preview (single card you can hover to flip)
  - On print: Two pages (Front then Back) sized to CR80 (85.6mm × 54mm) for Evolis Primacy2 duplex
  - Layout: Identical grid & positions on both sides; only language changes
  - Background shadow fits the card (cover + centered)
  - Employee signature: upload + optional drag (toggle) + size slider + reset
  - Official signature: fixed (fallback asset) or upload; name & title placed right below

  ✦ Printer tips (Primacy2):
  - Driver/Preferences → Print on both sides (Duplex): ON
  - Flip setting: If back side comes inverted, toggle between "flip on long edge" and "flip on short edge"
  - Page size: CR80 (85.6mm × 54mm) / Custom 85.6 × 54 mm / No margins
-->
<style>
  /* ====== Physical card size (CR80) ====== */
  @page { size: 85.6mm 54mm; margin: 0; }
  html, body { height: 100%; }
  body { margin: 0; font-family: Arial, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f4f4f4; }

  :root {
    --card-w-mm: 85.6mm;
    --card-h-mm: 54mm;
    --card-w: 350px; /* screen preview size */
    --card-h: 220px;
    --radius: 12px;
    --brand: #007bff;
  }

  h1 { text-align:center; margin: 16px 0 6px; }
  .hint { text-align:center; color:#555; margin: 0 0 16px; }

  form { max-width: 980px; margin: 10px auto; background:#fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .grid { display:grid; grid-template-columns: repeat(2, minmax(260px,1fr)); gap: 12px 16px; }
  h3 { margin: 14px 0 6px; text-decoration: underline; }
  label { display:block; font-size: 13px; margin: 4px 0; }
  input[type="text"], input[type="file"], .controls input[type="range"] { width:100%; padding:6px 8px; font-size:14px; border:1px solid #ccc; border-radius: 6px; }
  .controls { display:grid; grid-template-columns: repeat(4, minmax(120px,1fr)); gap:10px; align-items:end; margin-top: 8px; }
  .controls .row { display:flex; gap:4px; align-items:center; }
  button { padding: 10px 16px; background: var(--brand); color:#fff; border:0; border-radius: 8px; font-weight:600; cursor:pointer; }
  button.secondary { background:#444; }
  button:hover { filter: brightness(.95); }

  /* ====== Flip-able screen preview ====== */
  .stage { display:flex; justify-content:center; gap: 24px; flex-wrap:wrap; margin: 18px auto; }
  .preview-card { width: var(--card-w); height: var(--card-h); border-radius: var(--radius); position:relative; transform-style: preserve-3d; transition: transform .5s ease; cursor:pointer; }
  .preview-card:hover { transform: rotateY(180deg); }
  .side { position:absolute; inset:0; border:2px solid #000; border-radius: var(--radius); overflow:hidden; backface-visibility:hidden; font-size: 11px; line-height: 1.15; background:#fff; }
  .side.back { transform: rotateY(180deg); background:#eee; }

  .bg-watermark { position:absolute; inset:0; z-index:0; width:100%; height:100%; object-fit: cover; object-position: center; opacity: .13; }
  .logo { position:absolute; top:8px; left:8px; width:50px; height:50px; object-fit:contain; z-index:2; }
  .photo { position:absolute; top:8px; right:8px; width:72px; height:92px; object-fit: cover; border:1px solid #000; background:#fff; z-index:2; }
  .header { position:relative; z-index:2; text-align:center; padding-top:6px; }
  .header h6, .header h5, .header h4 { margin:2px 0; font-weight:700; }
  .header h4 { font-size:14px; text-decoration: underline; }
  .content { position:relative; z-index:2; padding: 6px 10px 0 10px; margin-top: 5px; }
  .content p { margin:2px 0; }

  .emp-sign { position:absolute; z-index:2; width:100px; height:20px; margin-left:85px; margin-top:15px; cursor: grab; user-select:none; }
  .emp-sign.dragging { cursor: grabbing; }
  .emp-sign-label { position:absolute; left:12px; top:198px; font-size:10px; z-index:3; background: rgba(255,255,255,.6); padding:0 2px; }

  .official-sign-wrap { position:absolute; right:10px; bottom:28px; z-index:2; text-align:center; }
  .official-sign { width:110px; height:15px; display:block; margin:0 auto 2px; }
  .official-meta { font-size:10px; line-height:1.0; }

  /* ====== Print layout (two separate pages) ====== */
  .print-page { display:none; }
  .print-card { width: var(--card-w-mm); height: var(--card-h-mm); position: relative; overflow:hidden; }
  .print-card .bg-watermark { opacity:.13; }
  .print-card .logo { top:2mm; left:2mm; width:10mm; height:10mm; }
  .print-card .photo { top:3mm; right:3mm; width:12mm; height:15mm; border: .3mm solid #000; }
  .print-card .header { padding-top: 2mm; }
  .print-card .content { margin-top: 2mm; padding: 0 3mm; font-size: 2mm; }
  .print-card .official-sign-wrap { right: 2mm; bottom: 3mm; }
  .print-card .official-sign { width: 20mm; }
  .print-card .official-meta { font-size: 2.3mm; }
  .print-card .emp-sign { left: 3mm; top: 36mm; width: 22mm; }
  .print-card .emp-sign-label { left: 3mm; top: 45mm; font-size: 2.2mm; }
  .border { position:absolute; inset:0; border: .4mm solid #000; border-radius: 2mm; }

  @media print {
    body { background: #fff; }
    form, .stage, .controls-help { display:none !important; }
    .print-page { display:block; break-after: page; page-break-after: always; }
  }
</style>
</head>
<body>
 <form id="idForm">
    <h3>नेपाली विवरण (Front)</h3>
    <div class="grid">
      <div>
        <label>कर्मचारीको परा नाम:</label><input type="text" id="name_ne" placeholder="उदाहरण: दिपक केसी" required>
        <label>कर्मचारी संकेत नं.:</label><input type="text" id="signal_no_ne" placeholder="12345" required>
        <label>पद:</label><input type="text" id="position_ne" placeholder="सहायक स्तर" required>
        <label>नागरिकता नम्बर/जारी जिल्ला:</label><input type="text" id="citizenship_ne" placeholder="१२-०१-००१-०१२३/रुकुम पश्चिम भाग" required>
        <label>राष्ट्रिय परिचयपत्र नम्बर:</label><input type="text" id="ra_pa_no_ne" placeholder="123456789" required>
        <label>रक्त समूह:</label><input type="text" id="blood_group_ne" placeholder="ए.बि. पोजेटिभ" required>
        <label>सम्पर्क नं.:</label><input type="text" id="contact_no_ne" placeholder="९८५७६२६५४२" required>
      </div>
      <div>
        <label>Photo Upload (कर्मचारी):</label>
        <input type="file" id="photo" accept="image/*" required>
        <label>Employee Signature Upload (कर्मचारी हस्ताक्षर):</label>
        <input type="file" id="empSignature" accept="image/*">
        <div class="controls">
          <div class="row">
            <input type="checkbox" id="enableDrag" />
            <label for="enableDrag">Drag कर्मचारी हस्ताक्षर</label>
          </div>
          <div>
            <label for="signSize">Signature Size (px)</label>
            <input type="range" id="signSize" min="50" max="200" value="120">
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" class="secondary" id="resetSig">Reset Signature Pos</button>
          </div>
        </div>
      </div>
    </div>

    <h3>English Details (Back)</h3>
    <div class="grid">
      <div>
        <label>Employee Name:</label><input type="text" id="name_en" placeholder="Deepak KC" required>
        <label>Employee Symbol No.:</label><input type="text" id="signal_no_en" placeholder="12345" required>
        <label>Position:</label><input type="text" id="position_en" placeholder="Assistant Level" required>
        <label>Citizenship No./Issued District:</label><input type="text" id="citizenship_en" placeholder="12-01-001-0123" required>
        <label>National Identity Card Number:</label><input type="text" id="ra_pa_no_en" placeholder="123456789" required>
        <label>Blood Group:</label><input type="text" id="blood_group_en" placeholder="O+" required>
        <label>Contact No.:</label><input type="text" id="contact_no_en" placeholder="98XXXXXXXX" required>
      </div>
      <div>
        <label>Office Stamp (optional):</label>
<input type="file" id="officeStamp" accept="image/*">

        <label>Official Signature (optional):</label>
        <input type="file" id="officialSignature" accept="image/*">
        <label>Official Name (NE):</label>
        <input type="text" id="official_name_ne" value="घनश्याम गौतम">
        <label>Official Title (NE):</label>
        <input type="text" id="official_title_ne" value="प्रमुख प्रशासकीय अधिकृत">
        <label>Official Name (EN):</label>
        <input type="text" id="official_name_en" value="Ghanshyam Gautam">
        <label>Official Title (EN):</label>
        <input type="text" id="official_title_en" value="Chief Administrative Officer">
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button type="button" id="generateBtn">Generate</button>
      <button type="button" onclick="window.print()" class="secondary">Print</button>
    </div>
  </form>

  <!-- Screen preview -->
  <div class="stage" id="stage"></div>

  <!-- Print pages (hidden on screen, shown in @media print) -->
  <div id="printFront" class="print-page"></div>
  <div id="printBack" class="print-page"></div>

<script>
  // ------ Assets (set to your filenames) ------
  const ASSETS = {
    logo: 'logo.png',               // top-left logo
    watermark: 'bgshadow.png',      // faint background for both sides
    officialSignFallback: 'signature1.png' // default official signature
  };

  const $ = (sel, ctx=document) => ctx.querySelector(sel);
  const fileToDataURL = (file) => new Promise((resolve) => {
    if (!file) return resolve(null);
    const fr = new FileReader(); fr.onload = e => resolve(e.target.result); fr.readAsDataURL(file);
  });

  const form = $('#idForm');
  const stage = $('#stage');
  const printFront = $('#printFront');
  const printBack = $('#printBack');
  const enableDrag = $('#enableDrag');
  const signSize = $('#signSize');
  const resetSig = $('#resetSig');

  let empSigW = 120; // px for preview; print uses mm mapping
  let empFrontPos = { left: 12, top: 168 }; // preview px
  let empBackPos  = { left: 12, top: 168 };

  signSize.addEventListener('input', () => {
    empSigW = parseInt(signSize.value, 10);
    document.querySelectorAll('.emp-sign').forEach(img => img.style.width = empSigW + 'px');
  });

  resetSig.addEventListener('click', () => {
    empFrontPos = { left: 12, top: 168 };
    empBackPos  = { left: 12, top: 168 };
    const f = document.querySelector('.emp-sign.front-side');
    const b = document.querySelector('.emp-sign.back-side');
    if (f) { f.style.left = empFrontPos.left + 'px'; f.style.top = empFrontPos.top + 'px'; }
    if (b) { b.style.left = empBackPos.left + 'px';  b.style.top = empBackPos.top + 'px'; }
  });

  function makeDraggable(img, bounds) {
    let dragging = false, sx=0, sy=0, sl=0, st=0;
    img.addEventListener('pointerdown', (e) => {
      if (!enableDrag.checked) return;
      dragging = true; img.classList.add('dragging');
      const rect = bounds.getBoundingClientRect(); const r = img.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; sl = r.left - rect.left; st = r.top - rect.top;
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener('pointermove', (e) => {
      if (!dragging) return; const dx = e.clientX - sx; const dy = e.clientY - sy;
      let nl = sl + dx, nt = st + dy;
      const rect = bounds.getBoundingClientRect(); const r = img.getBoundingClientRect();
      const maxL = rect.width - r.width; const maxT = rect.height - r.height;
      nl = Math.max(0, Math.min(maxL, nl)); nt = Math.max(0, Math.min(maxT, nt));
      img.style.left = nl + 'px'; img.style.top = nt + 'px';
    });
    const end = (e) => { if (!dragging) return; dragging = false; img.classList.remove('dragging'); img.releasePointerCapture(e.pointerId);
      const l = parseInt(img.style.left||'0',10), t = parseInt(img.style.top||'0',10);
      if (img.classList.contains('front-side')) empFrontPos = { left:l, top:t }; else empBackPos = { left:l, top:t };
    };
    img.addEventListener('pointerup', end); img.addEventListener('pointercancel', end);
  }

  $('#generateBtn').addEventListener('click', async () => {
    // Gather values
    const officeStampFile = $('#officeStamp').files[0] || null;

    const name_ne = $('#name_ne').value.trim();
    const signal_no_ne = $('#signal_no_ne').value.trim();
    const position_ne = $('#position_ne').value.trim();
    const citizenship_ne = $('#citizenship_ne').value.trim();
    const ra_pa_no_ne = $('#ra_pa_no_ne').value.trim();
    const blood_group_ne = $('#blood_group_ne').value.trim();
    const contact_no_ne = $('#contact_no_ne').value.trim();

    const name_en = $('#name_en').value.trim();
    const signal_no_en = $('#signal_no_en').value.trim();
    const position_en = $('#position_en').value.trim();
    const citizenship_en = $('#citizenship_en').value.trim();
    const ra_pa_no_en = $('#ra_pa_no_en').value.trim();
    const blood_group_en = $('#blood_group_en').value.trim();
    const contact_no_en = $('#contact_no_en').value.trim();

    const official_name_ne = $('#official_name_ne').value.trim();
    const official_title_ne = $('#official_title_ne').value.trim();
    const official_name_en = $('#official_name_en').value.trim();
    const official_title_en = $('#official_title_en').value.trim();

    const photoFile = $('#photo').files[0]; if (!photoFile) return alert('Please select a Photo');
    const empSignFile = $('#empSignature').files[0] || null;
    const officialSignFile = $('#officialSignature').files[0] || null;

    const [photoURL, empSigURL, officialSigURL] = await Promise.all([
      fileToDataURL(photoFile), fileToDataURL(empSignFile), fileToDataURL(officialSignFile)
    ]);
    const officialSign = officialSigURL || ASSETS.officialSignFallback;

    // ------- Build Screen Preview (flip) -------
    stage.innerHTML = `
      <div class="preview-card" id="previewCard">
        <div class="side front">
          <img class="bg-watermark" src="${ASSETS.watermark}" alt="bg">
          <img class="logo" src="${ASSETS.logo}" alt="logo">
          <img class="photo" src="${photoURL}" alt="photo">
          <div class="header">
            <h6>गलकोट नगरपालिका</h6>
            <h5>नगर कार्यपालिकाको कार्यालय</h5>
            <h6>गलकोट, बागलुङ</h6>
            <h4>कर्मचारी परिचय पत्र</h4>
          </div>
          <div class="content">
            <p>नाम: ${name_ne}</p>
            <p>कर्मचारी संकेत नम्बर: ${signal_no_ne}</p>
            <p>पद: ${position_ne}</p>
            <p>नागरिकता नम्बर/जारी जिल्ला: ${citizenship_ne}</p>
            <p>राष्ट्रिय परिचयपत्र नम्बर: ${ra_pa_no_ne}</p>
            <p>रक्त समूह: ${blood_group_ne}</p>
            <p>सम्पर्क नं.: ${contact_no_ne}</p>
          </div>
          ${empSigURL ? `<img src="${empSigURL}" class="emp-sign front-side" style="left:${empFrontPos.left}px; top:${empFrontPos.top}px; width:${empSigW}px;" alt="emp-sign">` : ''}
          ${empSigURL ? `<span class="emp-sign-label">कर्मचारीको हस्ताक्षर:-</span>` : ''}
          <div class="official-sign-wrap">
            <img class="official-sign" src="${officialSign}" alt="official">
            <div class="official-meta">
              <div>${official_name_ne}</div>
              <div>${official_title_ne}</div>
            </div>
          </div>
        </div>
        <div class="side back">
          <img class="bg-watermark" src="${ASSETS.watermark}" alt="bg">
          <img class="logo" src="${ASSETS.logo}" alt="logo">
          <img class="photo" src="${photoURL}" alt="photo">
          <div class="header">
            <h6>Galkot Municipality</h6>
            <h5>Office of the Municipal Executive</h5>
            <h6>Galkot, Baglung</h6>
            <h4>Employee Identity Card</h4>
          </div>
          <div class="content">
            <p>Name: ${name_en}</p>
            <p>Employee Symbol Number.: ${signal_no_en}</p>
            <p>Position: ${position_en}</p>
            <p>Citizenship Number/Issued district: ${citizenship_en}</p>
            <p>National Identity Card Number: ${ra_pa_no_en}</p>
            <p>Blood Group: ${blood_group_en}</p>
            <p>Contact No.: ${contact_no_en}</p>
          </div>
          ${empSigURL ? `<img src="${empSigURL}" class="emp-sign back-side" style="left:${empBackPos.left}px; top:${empBackPos.top}px; width:${empSigW}px;" alt="emp-sign">` : ''}
          ${empSigURL ? `<span class="emp-sign-label" style="left:${empBackPos.left}px; top:${empBackPos.top + 30}px;">Employee Signature:-</span>` : ''}
          <div class="official-sign-wrap">
            <img class="official-sign" src="${officialSign}" alt="official">
            <div class="official-meta">
              <div>${official_name_en}</div>
              <div>${official_title_en}</div>
            </div>
          </div>
        </div>
      </div>`;

    // Make preview signatures draggable
    document.querySelectorAll('.emp-sign').forEach(img => makeDraggable(img, $('#previewCard')));

    // ------- Build Print Pages (Front then Back) -------
    const frontHTML = `
      <div class="print-card">
        <div class="border"></div>
        <img class="bg-watermark" src="${ASSETS.watermark}" alt="bg">
        <img class="logo" src="${ASSETS.logo}" alt="logo">
        <img class="photo" src="${photoURL}" alt="photo">
        <div class="header" style="text-align:center;">
          <div style="font-weight:700; font-size:3mm; margin:.6mm 0 .2mm;">गलकोट नगरपालिका</div>
          <div style="font-weight:700; font-size:3mm; margin:.2mm 0;">नगर कार्यपालिकाको कार्यालय</div>
          <div style="font-weight:700; font-size:2.6mm;">गलकोट, बागलुङ</div>
          <div style="font-weight:700; font-size:3.2mm; text-decoration:underline; margin-top:.6mm;">कर्मचारी परिचय पत्र</div>
        </div>
        <div class="content">
          <div>नाम: ${name_ne}</div>
          <div>संकेत नं.: ${signal_no_ne}</div>
          <div>पद: ${position_ne}</div>
          <div>नागरिकता नं.: ${citizenship_ne}</div>
          <div>रा.प.नं.: ${ra_pa_no_ne}</div>
          <div>रक्त समूह: ${blood_group_ne}</div>
          <div>सम्पर्क नं.: ${contact_no_ne}</div>
        </div>
        ${empSigURL ? `<img src="${empSigURL}" class="emp-sign" style="left:3mm; top:36mm; width:22mm;">` : ''}
        ${empSigURL ? `<div class="emp-sign-label">कर्मचारीको हस्ताक्षर</div>` : ''}
        <div class="official-sign-wrap" style="right:2mm; bottom:2.6mm;">
          <img class="official-sign" src="${officialSign}" alt="official">
          <div class="official-meta">
            <div>${official_name_ne}</div>
            <div>${official_title_ne}</div>
          </div>
        </div>
      </div>`;

    const backHTML = `
      <div class="print-card">
        <div class="border"></div>
        <img class="bg-watermark" src="${ASSETS.watermark}" alt="bg">
        <img class="logo" src="${ASSETS.logo}" alt="logo">
        <img class="photo" src="${photoURL}" alt="photo">
        <div class="header" style="text-align:center;">
          <div style="font-weight:700; font-size:3mm; margin:.6mm 0 .2mm;">Galkot Municipality</div>
          <div style="font-weight:700; font-size:3mm; margin:.2mm 0;">Office of the Municipal Executive</div>
          <div style="font-weight:700; font-size:2.6mm;">Galkot, Baglung</div>
          <div style="font-weight:700; font-size:3.2mm; text-decoration:underline; margin-top:.6mm;">Employee Identity Card</div>
        </div>
        <div class="content">
          <div>Name: ${name_en}</div>
          <div>Signal Number.: ${signal_no_en}</div>
          <div>Position: ${position_en}</div>
          <div>Citizenship Number/Issued district: ${citizenship_en}</div>
          <div>National Identity Card Number: ${ra_pa_no_en}</div>
          <div>Blood Group: ${blood_group_en}</div>
          <div>Contact Number: ${contact_no_en}</div>
        </div>
        ${empSigURL ? `<img src="${empSigURL}" class="emp-sign" style="left:3mm; top:36mm; width:22mm;">` : ''}
        ${empSigURL ? `<div class="emp-sign-label">Employee Signature</div>` : ''}
        <div class="official-sign-wrap" style="right:2mm; bottom:2.6mm;">
          <img class="official-sign" src="${officialSign}" alt="official">
          <div class="official-meta">
            <div>${official_name_en}</div>
            <div>${official_title_en}</div>
          </div>
        </div>
      </div>`;

    printFront.innerHTML = frontHTML;
    printBack.innerHTML = backHTML;
  });
</script>
</body>
</html>
