<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>गलकोट नगरपालिकाको कर्मचारी परिचयपत्र</title>
<style>
  /* ====== Physical card size (CR80) ====== */
  @page { size: 85.6mm 54mm; margin: 0; }
  html, body { height: 100%; }
  body { margin: 0; font-family: Arial, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f4f4f4; }

  :root {
    --card-w-mm: 85.6mm;
    --card-h-mm: 54mm;
    --card-w: 350px; /* screen preview size */
    --card-h: 220px;
    --radius: 12px;
    --brand: #007bff;
  }

  h1 { text-align:center; margin: 16px 0 6px; }
  .hint { text-align:center; color:#00008B; margin: 0 0 16px; }

  /* Layout changes to fit Saved Records on the right */
  .main-container { display: flex; max-width: 1300px; margin: 10px auto; gap: 20px; padding: 0 10px; }
  form { flex: 2; background:#fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  
  /* Saved List Sidebar & Settings Styling */
  .saved-sidebar { flex: 1; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .settings-box { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px dashed #ccc; }
  .saved-list { list-style: none; padding: 0; margin: 0; }
  .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  .saved-item:hover { background: #f9f9f9; }
  .item-actions button { padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-left: 4px; }
  .btn-use { background: #28a745 !important; }
  .btn-delete { background: #dc3545 !important; }

  .grid { display:grid; grid-template-columns: repeat(2, minmax(260px,1fr)); gap: 12px 16px; }
  h3 { margin: 14px 0 6px; text-decoration: underline; }
  label { display:block; font-size: 13px; margin: 4px 0; font-weight: 600; }
  input[type="text"], input[type="file"], .controls input[type="range"] { width:100%; padding:6px 8px; font-size:14px; border:1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .controls { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; align-items:end; margin-top: 8px; }
  .controls .row { display:flex; gap:4px; align-items:center; }
  button { padding: 10px 16px; background: var(--brand); color:#fff; border:0; border-radius: 8px; font-weight:600; cursor:pointer; }
  button.secondary { background:#444; }
  button:hover { filter: brightness(.95); }

  /* ====== Flip-able screen preview ====== */
  .stage { display:flex; justify-content:center; gap: 24px; flex-wrap:wrap; margin: 18px auto; }
  .preview-card { width: var(--card-w); height: var(--card-h); border-radius: var(--radius); position:relative; transform-style: preserve-3d; transition: transform .5s ease; cursor:pointer; }
  .preview-card:hover { transform: rotateY(180deg); }
  .side { position:absolute; inset:0; border:2px solid #000; border-radius: var(--radius); overflow:hidden; backface-visibility:hidden; font-size: 14px; line-height: 1.15; background:#fff; }
  .side.back { transform: rotateY(180deg); background:#eee; }

  .bg-watermark { position:absolute; inset:0; z-index:0; width:100%; height:100%; object-fit: cover; object-position: center; opacity: .13; }
  .logo { position:absolute; top:8px; left:8px; width:50px; height:50px; object-fit:contain; z-index:2; }
  .photo { position:absolute; top:8px; right:8px; width:72px; height:92px; object-fit: cover; border:1px solid #000; background:#fff; z-index:2; }
  .header { position:relative; z-index:2; text-align:center; padding-top:6px; }
  .header h6, .header h5, .header h4 { margin:2px 0; font-weight:bold; color:red;}
  .header h4 { font-size:14px; text-decoration: underline; }
  .content { position:relative; z-index:2; padding: 8px 13px 0 13px; margin-top: 5px; }
  .content p { margin:2px 0; }

  .emp-sign { position:absolute; z-index:2; width:100px; height:20px; margin-left:85px; margin-top:30px; cursor: grab; user-select:none; }
  .emp-sign.dragging { cursor: grabbing; }
  .emp-sign-label { position:absolute; left:12px; top:220px; font-size:10px; z-index:1; background: rgba(255,255,255,.6); padding:0 2px; }

  .official-sign-wrap { position:absolute; right:10px; bottom:28px; z-index:2; text-align:center; }
  .official-sign { width:110px; height:15px; display:block; margin:0 auto 2px; }
  .official-meta { font-size:10px; line-height:1.0; }

  /* ====== Print layout ====== */
  .print-page { display:none; }
  .print-card { width: var(--card-w-mm); height: var(--card-h-mm); position: relative; overflow:hidden; }
  .print-card .bg-watermark { opacity:.13; }
  .print-card .logo { top:2mm; left:2mm; width:10mm; height:10mm; }
  .print-card .photo { top:3mm; right:3mm; width:14mm; height:18mm; border: .3mm solid #000; }
  .print-card .header { padding-top: 1mm; color:red;}
  .print-card .content { margin-top: 0mm; padding: 0 3mm; font-size: 3mm; font-weight:bold; }
  .print-card .official-sign-wrap { right: 2mm; bottom: 3mm; }
  .print-card .official-sign { width: 20mm; }
  .print-card .official-meta { font-size: 3mm; }
  .print-card .emp-sign { left: 4mm; top: 51mm; width: 20mm; }
  .print-card .emp-sign-label { left: 8mm; top: 48mm; font-size: 3mm; }
  .border { position:absolute; inset:0; border: .4mm solid #000; border-radius: 2mm; }

  @media print {
    body { background: #fff; }
    .main-container, .stage, .controls-help { display:none !important; }
    .print-page { display:block; break-after: page; page-break-after: always; }
  }
</style>
</head>
<body>

<div class="main-container">
  <!-- Form input section -->
  <form id="idForm">
    <input type="hidden" id="edit_index" value="">

    <h3>नेपाली विवरण (Front)</h3>
    <div class="grid">
      <div>
        <label>कर्मचारीको पूरा नाम:</label><input type="text" id="name_ne" placeholder="उदाहरण: दिपक केसी" required>
        <label>कर्मचारी संकेत नं.:</label><input type="text" id="signal_no_ne" placeholder="12345" required>
        <label>पद:</label><input type="text" id="position_ne" placeholder="सहायक स्तर" required>
        <label>ना.प्र.नं./जारी जिल्ला:</label><input type="text" id="citizenship_ne" placeholder="१२-०१-००१-०१२३/रुकुम पश्चिम" required>
        <label>राष्ट्रिय परिचयपत्र नम्बर:</label><input type="text" id="ra_pa_no_ne" placeholder="123456789" required>
        <label>रक्त समूह:</label><input type="text" id="blood_group_ne" placeholder="ए.बि. पोजेटिभ" required>
        <label>सम्पर्क नं.:</label><input type="text" id="contact_no_ne" placeholder="९८५७६२६५४२" required>
      </div>
      <div>
        <label>Photo Upload (कर्मचारीको फोटो):</label>
        <input type="file" id="photo" accept="image/*">
        <label>Employee Signature (कर्मचारी हस्ताक्षर):</label>
        <input type="file" id="empSignature" accept="image/*">
        <div class="controls">
          <div class="row">
            <input type="checkbox" id="enableDrag" />
            <label for="enableDrag">Drag</label>
          </div>
          <div>
            <label for="signSize">Size (px)</label>
            <input type="range" id="signSize" min="50" max="200" value="120">
          </div>
          <div>
            <button type="button" class="secondary" id="resetSig" style="padding: 6px 10px; font-size:12px;">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <h3>English Details (Back)</h3>
    <div class="grid">
      <div>
        <label>Employee Name:</label><input type="text" id="name_en" placeholder="Deepak KC" required>
        <label>Employee SheetRoll No.:</label><input type="text" id="signal_no_en" placeholder="12345" required>
        <label>Position:</label><input type="text" id="position_en" placeholder="Assistant Level" required>
        <label>Citizenship No./Issued District:</label><input type="text" id="citizenship_en" placeholder="12-01-001-0123" required>
        <label>NId No:</label><input type="text" id="ra_pa_no_en" placeholder="123456789" required>
        <label>Blood Group:</label><input type="text" id="blood_group_en" placeholder="O+" required>
        <label>Contact No.:</label><input type="text" id="contact_no_en" placeholder="98XXXXXXXX" required>
      </div>
      <div>
        <label>Official Name (NE):</label>
        <input type="text" id="official_name_ne" value="सुर्य प्रसाद उपाध्याय">
        <label>Official Title (NE):</label>
        <input type="text" id="official_title_ne" value="प्रमुख प्रशासकीय अधिकृत">
        <label>Official Name (EN):</label>
        <input type="text" id="official_name_en" value="Surya Prasad Upadhyay">
        <label>Official Title (EN):</label>
        <input type="text" id="official_title_en" value="Chief Administrative Officer">
        <label style="color: gray; margin-top: 10px;">Office Stamp (optional):</label>
        <input type="file" id="officeStamp" accept="image/*">
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button type="button" id="generateBtn">Generate & Auto Save</button>
      <button type="button" id="printBtn" class="secondary">Print</button>
    </div>
  </form>

  <!-- Sidebar section for Saved Records & Master Signature -->
  <div class="saved-sidebar">
    <!-- थपिएको: Official Signature Master Auto Save Settings -->
    <div class="settings-box">
      <h4 style="margin: 0 0 8px 0; color: #d9534f; font-size: 14px;">✒️ Official Signature Master (Auto-Save)</h4>
      <p style="font-size: 11px; margin: 0 0 8px 0; color: #555;">कार्यालय प्रमुखको हस्ताक्षर यहाँ १ पटक सेभ गरेपछि सधैं स्वतः प्रयोग हुनेछ।</p>
      <input type="file" id="masterOfficialSignature" accept="image/*" style="font-size: 12px; padding: 4px;">
      <button type="button" id="saveMasterSigBtn" style="padding: 5px 10px; font-size: 12px; background: #333; width: 100%; margin-top: 5px;">Save Official Sign</button>
      <div id="masterSigStatus" style="font-size:11px; color: green; margin-top: 4px; font-weight: bold;"></div>
    </div>

    <div>
      <h3 style="margin-top: 0;">सुरक्षित विवरणहरू (Saved)</h3>
      <ul class="saved-list" id="savedList"></ul>
    </div>
  </div>
</div>

<!-- Screen preview -->
<div class="stage" id="stage"></div>

<!-- Print pages -->
<div id="printFront" class="print-page"></div>
<div id="printBack" class="print-page"></div>

<script>
  const ASSETS = {
    logo: 'logo.png',               
    watermark: 'bgshadow.png',      
    officialSignFallback: 'signature1.png' 
  };

  const $ = (sel, ctx=document) => ctx.querySelector(sel);
  
  const fileToDataURL = (file) => new Promise((resolve) => {
    if (!file) return resolve(null);
    const fr = new FileReader(); fr.onload = e => resolve(e.target.result); fr.readAsDataURL(file);
  });

  const form = $('#idForm');
  const stage = $('#stage');
  const printFront = $('#printFront');
  const printBack = $('#printBack');
  const enableDrag = $('#enableDrag');
  const signSize = $('#signSize');
  const resetSig = $('#resetSig');
  const savedList = $('#savedList');
  const editIndexInput = $('#edit_index');
  const masterOfficialSignatureInput = $('#masterOfficialSignature');
  const masterSigStatus = $('#masterSigStatus');

  let empSigW = 120; 
  let empFrontPos = { left: 12, top: 168 }; 
  let empBackPos  = { left: 12, top: 168 };

  let currentLoadedImages = { photo: '', empSignature: '', officeStamp: '' };
  let globalOfficialSignDataURL = ''; // मास्टर हस्ताक्षर राख्ने ग्लोबल भेरिएबल

  // पेज लोड हुँदा मास्टर हस्ताक्षर र रेकर्डहरू तान्ने
  window.onload = function() {
    loadSavedRecords();
    
    // लोकल-स्टोरेजबाट मास्टर हस्ताक्षर चेक गर्ने
    const savedMasterSig = localStorage.getItem('galkot_master_official_sig');
    if (savedMasterSig) {
      globalOfficialSignDataURL = savedMasterSig;
      masterSigStatus.innerText = "✓ Official Signature Loaded (Auto Mode)";
    } else {
      globalOfficialSignDataURL = ASSETS.officialSignFallback;
      masterSigStatus.innerText = "⚠ Using Fallback Sign (Not saved yet)";
    }
  };

  // मास्टर हस्ताक्षर सेभ गर्ने बटन
  $('#saveMasterSigBtn').addEventListener('click', async () => {
    const file = masterOfficialSignatureInput.files[0];
    if (!file) {
      alert("कृपया पहिले एउटा हस्ताक्षर फाइल छनौट गर्नुहोस्!");
      return;
    }
    const dataURL = await fileToDataURL(file);
    localStorage.setItem('galkot_master_official_sig', dataURL);
    globalOfficialSignDataURL = dataURL;
    masterSigStatus.innerText = "✓ Official Signature Saved & Activated!";
    alert("कार्यालय प्रमुखको हस्ताक्षर सफलतापूर्वक सुरक्षित गरियो! अब परिचय पत्र बनाउँदा यो स्वतः बस्नेछ।");
  });

  signSize.addEventListener('input', () => {
    empSigW = parseInt(signSize.value, 10);
    document.querySelectorAll('.emp-sign').forEach(img => img.style.width = empSigW + 'px');
  });

  resetSig.addEventListener('click', () => {
    empFrontPos = { left: 12, top: 168 };
    empBackPos  = { left: 12, top: 168 };
    const f = document.querySelector('.emp-sign.front-side');
    const b = document.querySelector('.emp-sign.back-side');
    if (f) { f.style.left = empFrontPos.left + 'px'; f.style.top = empFrontPos.top + 'px'; }
    if (b) { b.style.left = empBackPos.left + 'px';  b.style.top = empBackPos.top + 'px'; }
  });

  function makeDraggable(img, bounds) {
    let dragging = false, sx=0, sy=0, sl=0, st=0;
    img.addEventListener('pointerdown', (e) => {
      if (!enableDrag.checked) return;
      dragging = true; img.classList.add('dragging');
      const rect = bounds.getBoundingClientRect(); const r = img.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; sl = r.left - rect.left; st = r.top - rect.top;
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener('pointermove', (e) => {
      if (!dragging) return; const dx = e.clientX - sx; const dy = e.clientY - sy;
      let nl = sl + dx, nt = st + dy;
      const rect = bounds.getBoundingClientRect(); const r = img.getBoundingClientRect();
      const maxL = rect.width - r.width; const maxT = rect.height - r.height;
      nl = Math.max(0, Math.min(maxL, nl)); nt = Math.max(0, Math.min(maxT, nt));
      img.style.left = nl + 'px'; img.style.top = nt + 'px';
    });
    const end = (e) => { if (!dragging) return; dragging = false; img.classList.remove('dragging'); img.releasePointerCapture(e.pointerId);
      const l = parseInt(img.style.left||'0',10), t = parseInt(img.style.top||'0',10);
      if (img.classList.contains('front-side')) empFrontPos = { left:l, top:t }; else empBackPos = { left:l, top:t };
    };
    img.addEventListener('pointerup', end); img.addEventListener('pointercancel', end);
  }

  function loadSavedRecords() {
    savedList.innerHTML = '';
    const records = JSON.parse(localStorage.getItem('galkot_id_records') || '[]');
    
    records.forEach((rec, index) => {
      const li = document.createElement('li');
      li.className = 'saved-item';
      li.innerHTML = `
        <div><strong>${rec.name_ne}</strong> (${rec.signal_no_ne})</div>
        <div class="item-actions">
          <button type="button" class="btn-use" onclick="useRecord(${index})">Use/Edit</button>
          <button type="button" class="btn-delete" onclick="deleteRecord(${index})">Delete</button>
        </div>
      `;
      savedList.appendChild(li);
    });
  }

  window.useRecord = function(index) {
    const records = JSON.parse(localStorage.getItem('galkot_id_records') || '[]');
    const rec = records[index];
    if (!rec) return;

    $('#name_ne').value = rec.name_ne;
    $('#signal_no_ne').value = rec.signal_no_ne;
    $('#position_ne').value = rec.position_ne;
    $('#citizenship_ne').value = rec.citizenship_ne;
    $('#ra_pa_no_ne').value = rec.ra_pa_no_ne;
    $('#blood_group_ne').value = rec.blood_group_ne;
    $('#contact_no_ne').value = rec.contact_no_ne;

    $('#name_en').value = rec.name_en;
    $('#signal_no_en').value = rec.signal_no_en;
    $('#position_en').value = rec.position_en;
    $('#citizenship_en').value = rec.citizenship_en;
    $('#ra_pa_no_en').value = rec.ra_pa_no_en;
    $('#blood_group_en').value = rec.blood_group_en;
    $('#contact_no_en').value = rec.contact_no_en;

    $('#official_name_ne').value = rec.official_name_ne;
    $('#official_title_ne').value = rec.official_title_ne;
    $('#official_name_en').value = rec.official_name_en;
    $('#official_title_en').value = rec.official_title_en;

    currentLoadedImages.photo = rec.photoURL || '';
    currentLoadedImages.empSignature = rec.empSigURL || '';
    currentLoadedImages.officeStamp = rec.officeStampURL || '';

    $('#photo').value = '';
    $('#empSignature').value = '';
    $('#officeStamp').value = '';

    editIndexInput.value = index;
    $('#generateBtn').innerText = "Update & Save";
    
    alert(rec.name_ne + " को विवरण लोड भयो।");
  };

  window.deleteRecord = function(index) {
    if(!confirm("के तपाईं यो विवरण हटाउन चाहनुहुन्छ?")) return;
    let records = JSON.parse(localStorage.getItem('galkot_id_records') || '[]');
    records.splice(index, 1);
    localStorage.setItem('galkot_id_records', JSON.stringify(records));
    loadSavedRecords();
    
    if(editIndexInput.value == index) {
      form.reset();
      editIndexInput.value = '';
      $('#generateBtn').innerText = "Generate & Auto Save";
    }
  };

  $('#generateBtn').addEventListener('click', async () => {
    if(!$('#name_ne').value || !$('#signal_no_ne').value) {
      return alert("कृपया कर्मचारीको नाम र संकेत नम्बर अनिवार्य भर्नुहोस्।");
    }

    const photoFile = $('#photo').files[0];
    if (!photoFile && !currentLoadedImages.photo) {
      return alert('कृपया कर्मचारीको फोटो अपलोड गर्नुहोस्।');
    }

    const empSignFile = $('#empSignature').files[0] || null;
    const officeStampFile = $('#officeStamp').files[0] || null;

    const uPhoto = photoFile ? await fileToDataURL(photoFile) : currentLoadedImages.photo;
    const uEmpSig = empSignFile ? await fileToDataURL(empSignFile) : currentLoadedImages.empSignature;
    const uOfficeStamp = officeStampFile ? await fileToDataURL(officeStampFile) : currentLoadedImages.officeStamp;

    // अटो-सेभ्ड मास्टर हस्ताक्षर सिधै प्रयोग गर्ने
    const officialSign = globalOfficialSignDataURL;

    const recordData = {
      name_ne: $('#name_ne').value.trim(),
      signal_no_ne: $('#signal_no_ne').value.trim(),
      position_ne: $('#position_ne').value.trim(),
      citizenship_ne: $('#citizenship_ne').value.trim(),
      ra_pa_no_ne: $('#ra_pa_no_ne').value.trim(),
      blood_group_ne: $('#blood_group_ne').value.trim(),
      contact_no_ne: $('#contact_no_ne').value.trim(),
      name_en: $('#name_en').value.trim(),
      signal_no_en: $('#signal_no_en').value.trim(),
      position_en: $('#position_en').value.trim(),
      citizenship_en: $('#citizenship_en').value.trim(),
      ra_pa_no_en: $('#ra_pa_no_en').value.trim(),
      blood_group_en: $('#blood_group_en').value.trim(),
      contact_no_en: $('#contact_no_en').value.trim(),
      official_name_ne: $('#official_name_ne').value.trim(),
      official_title_ne: $('#official_title_ne').value.trim(),
      official_name_en: $('#official_name_en').value.trim(),
      official_title_en: $('#official_title_en').value.trim(),
      photoURL: uPhoto,
      empSigURL: uEmpSig,
      officeStampURL: uOfficeStamp
    };

    let records = JSON.parse(localStorage.getItem('galkot_id_records') || '[]');
    const editIndex = editIndexInput.value;

    if (editIndex !== "") {
      records[editIndex] = recordData;
      editIndexInput.value = ""; 
      $('#generateBtn').innerText = "Generate & Auto Save";
    } else {
      records.push(recordData);
    }
    
    localStorage.setItem('galkot_id_records', JSON.stringify(records));
    loadSavedRecords(); 

    // ------- बिल्ड स्क्रीन प्रिभ्यू (Flip Card) -------
    stage.innerHTML = `
      <div class="preview-card" id="previewCard">
        <div class="side front">
          <img class="bg-watermark" src="${ASSETS.watermark}" alt="bg">
          <img class="logo" src="${ASSETS.logo}" alt="logo">
          <img class="photo" src="${uPhoto}" alt="photo">
          <div class="header">
            <h6>गलकोट नगरपालिका</h6>
            <h5>नगर कार्यपालिकाको कार्यालय</h5>
            <h6>गलकोट, बागलुङ</h6>
            <h4>कर्मचारी परिचय पत्र</h4>
          </div>
          <div class="content">
            <p>नाम: ${recordData.name_ne}</p>
            <p>कर्मचारी संकेत नम्बर: ${recordData.signal_no_ne}</p>
            <p>पद: ${recordData.position_ne}</p>
            <p>ना.प्र.नं./जारी जिल्ला: ${recordData.citizenship_ne}</p>
            <p>रा.प.नं.: ${recordData.ra_pa_no_ne}</p>
            <p>रक्त समूह: ${recordData.blood_group_ne}</p>
            <p>सम्पर्क नं.: ${recordData.contact_no_ne}</p>
          </div>

    document.querySelectorAll('.emp-sign').forEach(img => makeDraggable(img, $('#previewCard')));

          <div style="font-weight:700; font-size:2.6mm;">Galkot, Baglung</div>
          <div style="font-weight:700; font-size:3.2mm; text-decoration:underline; margin-top:.6mm;">Employee Identity Card</div>

        <div class="content">
          <div>Name: ${recordData.name_en}</div>

            <div>${recordData.official_title_en}</div>
          </div>
        </div>
      </div>`;

    printFront.innerHTML = frontHTML;
    printBack.innerHTML = backHTML;
    
    // फारम सफा गर्ने (तर मास्टर डिजिटल हस्ताक्षर यथावत रहन्छ)
    form.reset();
    currentLoadedImages = { photo: '', empSignature: '', officeStamp: '' };
    
    alert("परिचय पत्र सफलतापूर्वक निर्माण भयो र विवरण स्वतः सुरक्षित भयो।");
  });

  $('#printBtn').addEventListener('click', () => {
    if(!printFront.innerHTML || !printBack.innerHTML) {
      alert("प्रिन्ट गर्नु अगाडि कृपया 'Generate & Auto Save' बटन थिचेर कार्ड तयार पार्नुहोस्।");
