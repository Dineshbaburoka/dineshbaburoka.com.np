<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>प्रणाली लगइन - गलकोट नगरपालिका</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #0c2461;
      --secondary-color: #1e3799;
      --bg-color: #f1f2f6;
      --card-bg: #ffffff;
      --border-color: #ced6e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Noto Sans Devanagari', sans-serif; 
      background: var(--bg-color); 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-wrapper { 
      width: 100%;
      max-width: 400px; 
      background: var(--card-bg); 
      padding: 35px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
      border-top: 6px solid var(--primary-color); 
    }
    
    .auth-title { 
      text-align: center; 
      color: var(--primary-color); 
      font-size: 22px; 
      font-weight: bold; 
      margin-bottom: 25px; 
    }
    
    .field { 
      display: flex; 
      flex-direction: column; 
      margin-bottom: 15px; 
    }
    
    .field label { 
      font-weight: 600; 
      margin-bottom: 5px; 
      font-size: 14px; 
      color: #57606f; 
    }
    
    .field input { 
      padding: 12px; 
      border: 2px solid var(--border-color); 
      border-radius: 6px; 
      font-size: 14px; 
      outline: none; 
      transition: 0.2s; 
    }
    
    .field input:focus { 
      border-color: var(--secondary-color); 
    }

    .btn { 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      width: 100%;
      transition: 0.3s; 
      background: var(--primary-color);
      margin-top: 10px;
    }
    .btn:hover { 
      background: var(--secondary-color); 
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-title">🏛️ प्रणाली लगइन (System Login)</div>
    
    <form id="loginForm">
      <!-- इमेल -->
      <div class="field">
        <label>आधिकारिक इमेल (Email)</label>
        <input type="email" id="loginEmail" placeholder="staff@galkotmun.gov.np" required>
      </div>
      
      <!-- पासवर्ड -->
      <div class="field">
        <label>पासवर्ड (Password)</label>
        <input type="password" id="loginPassword" placeholder="******" required>
      </div>
      
      <!-- लगइन बटन -->
      <button type="submit" class="btn">🔐 लगइन गर्नुस्</button>
    </form>
  </div>

  <script>
    // Supabase Connect Settings
    const SUPABASE_URL = "https://lyjokogftwtvnhwszqni.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gxEL2-GVTVy8E0WxMBZHDQ_b5TzsDI9"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // लगइन प्रोसेस
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      // `system_users` टेबलबाट रोल (role) समेत तान्ने
      const { data, error } = await _supabase
        .from('system_users')
        .select('fullname, email, role')
        .eq('email', email)
        .eq('password', password)
        .maybeSingle();

      if (error) {
        alert("❌ प्राविधिक त्रुटि: " + error.message);
      } else if (data) {
        // सेसन डाटाहरू स्थानीय रूपमा सुरक्षित राख्ने
        localStorage.setItem("userLoggedIn", "true");
        localStorage.setItem("loggedInUserEmail", data.email);
        localStorage.setItem("userRole", data.role); // रोल पनि सेभ गर्ने

        // डाटाबेसमा भएको रोल (Role) को आधारमा पेज रिडाइरेक्ट गर्ने (स्वतः छनौट)
        if (data.role === "admin") {
            window.location.href = "admin.html";
        } else if (data.role === "staff") {
            window.location.href = "mapform.html";
        } else if (data.role === "consultancy") {
            window.location.href = "consultancy.html";
        } else {
            // यदि डाटाबेसमा रोल खाली छ वा कुनै पनि रोल मिल्दैन भने डिफल्ट पेजमा लैजाने
            window.location.href = "dashboard.html";
        }

      } else {
        alert("❌ गलत इमेल वा पासवर्ड! कृपया पुनः जाँच्नुहोस्।");
      }
    });
  </script>

</body>
</html>
