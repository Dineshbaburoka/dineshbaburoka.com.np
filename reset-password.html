<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासवर्ड रिसेट - गलकोट नगरपालिका</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- RESET PASSWORD CARD -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-100">
        
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-3 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">गलकोट नगरपालिका</h2>
            <p class="text-xs text-gray-500 mt-1">कर्मचारी व्यवस्थापन प्रणाली</p>
            <h3 class="text-sm font-semibold text-emerald-600 mt-3 border-b border-gray-100 pb-2">नयाँ पासवर्ड राख्नुहोस् (Reset Password)</h3>
        </div>

        <!-- Notification / Message Alert Box -->
        <div id="alert-box" class="hidden text-xs p-3 rounded-lg mb-4 text-center font-medium"></div>

        <!-- RESET FORM -->
        <form id="reset-password-form" onsubmit="handlePasswordReset(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">नयाँ पासवर्ड (New Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="new-password" required minlength="6" class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="नयाँ पासवर्ड टाइप गर्नुहोस्">
                    <button type="button" onclick="togglePasswordVisibility('new-password', 'toggle-icon-1')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer">
                        <i id="toggle-icon-1" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">पासवर्ड पुनः पुष्टि गर्नुहोस् (Confirm Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="password" id="confirm-password" required minlength="6" class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="पासवर्ड पुनः टाइप गर्नुहोस्">
                    <button type="button" onclick="togglePasswordVisibility('confirm-password', 'toggle-icon-2')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer">
                        <i id="toggle-icon-2" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="reset-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-floppy-disk"></i> पासवर्ड अद्यावधिक गर्नुहोस् (Update Password)
            </button>
        </form>

        <!-- BACK TO LOGIN -->
        <div class="text-center mt-6 border-t border-gray-100 pt-4">
            <a href="index.html" class="text-xs text-emerald-600 hover:text-emerald-700 font-semibold flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> लगइन पृष्ठमा फर्किनुहोस् (Back to Login)
            </a>
        </div>

    </div>

    <!-- SCRIPT FOR SUPABASE RESET LOGIC -->
    <script>
        // 1. SUPABASE CONFIGURATION
        // नोट: मुख्य html मा प्रयोग गरिएको Supabase credentials/URL नै यहाँ राख्नुहोस्।
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Alert helper
        function showAlert(message, isError = false) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-700');
            
            if (isError) {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700');
            }
        }

        // Toggle password view
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Check hash / access_token from email link when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            
            // Supabase password reset link contains #access_token=... or type=recovery
            if (!hash || !hash.includes('access_token')) {
                showAlert('अवैध वा म्याद सकिएको लिङ्क! कृपया पुन: Email मा Reset Link माग गर्नुहोस्।', true);
                document.getElementById('reset-password-form').classList.add('opacity-50', 'pointer-events-none');
            }
        });

        // 2. HANDLE PASSWORD RESET FORM SUBMISSION
        async function handlePasswordReset(event) {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const btn = document.getElementById('reset-btn');

            if (newPassword !== confirmPassword) {
                showAlert('दुवै पासवर्ड मिलेनन्! कृपया पुनः प्रयास गर्नुहोस्।', true);
                return;
            }

            if (newPassword.length < 6) {
                showAlert('पासवर्ड कम्तिमा ६ अक्षरको हुनुपर्छ।', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> अद्यावधिक हुँदैछ...`;

            try {
                // Update password in Supabase Auth
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showAlert('पासवर्ड सफलतापूर्वक परिवर्तन भयो! अब लगइन गर्नुहोस्।', false);
                document.getElementById('reset-password-form').reset();

                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirect to login page
                }, 2500);

            } catch (err) {
                console.error("Password Update Error:", err);
                showAlert(err.message || 'पासवर्ड रिसेट गर्दा समस्या आयो। कृपया पुनः लिङ्क प्रयोग गर्नुहोस्।', true);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> पासवर्ड अद्यावधिक गर्नुहोस् (Update Password)`;
            }
        }
    </script>
</body>
</html>
