<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Slider with 6 Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f7f6;
    }

    header {
      background: linear-gradient(90deg, #007bff, #28a745);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2.2rem;
      margin: 0;
    }

    .slider-container {
      max-width: 90%;
      margin: 30px auto;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .slider-container a {
      display: inline-block;
      width: 100%;
    }

    .slider-container img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: none;
      border-radius: 10px;
      transition: opacity 0.5s ease-in-out;
    }

    .slider-container img.active {
      display: block;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 20px 15px;
      margin-top: 50px;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to Image Slider</h1>
  </header>

  <div class="slider-container">
    <a href="img1.jpg" download>
      <img src="img1.jpg" class="active" alt="Image 1">
    </a>
    <a href="img2.jpg" download>
      <img src="img2.jpg" alt="Image 2">
    </a>
    <a href="img3.jpg" download>
      <img src="img3.jpg" alt="Image 3">
    </a>
    <a href="img4.jpg" download>
      <img src="img4.jpg" alt="Image 4">
    </a>
    <a href="img5.jpg" download>
      <img src="img5.jpg" alt="Image 5">
    </a>
    <a href="img6.jpg" download>
      <img src="img6.jpg" alt="Image 6">
    </a>
  </div>

  <footer>
    &copy; 2025 Dinesh Babu Roka. All rights reserved.
  </footer>

  <script>
    const slides = document.querySelectorAll(".slider-container img");
    let currentIndex = 0;

    setInterval(() => {
      slides[currentIndex].classList.remove("active");
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add("active");
    }, 3000);
  </script>

</body>
</html>
