@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --paper: #FAF7F0;
  --paper-deep: #F1ECDF;
  --ink: #1B2A3A;
  --charcoal: #2B2B2B;
  --brass: #A9812D;
  --sage: #5B6E5B;
  --rule: #DCD5C4;
  --rust: #8C4A3A;
}

/* ---------- Top utility bar (present on every page) ---------- */
.top-bar {
  background: var(--ink);
  color: var(--paper);
}
.top-bar .inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0;
  font-size: 0.8125rem;
}
.top-bar-mark {
  font-family: 'Source Serif 4', Georgia, serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--paper);
  opacity: 0.92;
}
.top-bar-mark:hover { opacity: 1; }
.top-bar-links { display: flex; align-items: center; gap: 1.25rem; }
.top-bar-links a, .top-bar-links button {
  color: var(--paper);
  opacity: 0.75;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
  padding: 0;
}
.top-bar-links a:hover, .top-bar-links button:hover { opacity: 1; color: var(--brass); }

.bell-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  line-height: 1;
}
.bell-badge {
  position: absolute;
  top: -6px;
  right: -9px;
  background: var(--rust);
  color: var(--paper);
  font-size: 0.65rem;
  font-weight: 600;
  min-width: 16px;
  height: 16px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  opacity: 1;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

  background-repeat: no-repeat;
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  color: var(--charcoal);
  font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--brass); color: var(--paper); }

*:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

a { color: inherit; text-decoration: none; }

@keyframes riseIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.serif { font-family: 'Source Serif 4', Georgia, serif; }

.wrap {
  max-width: 56rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.measure { max-width: 42rem; }

/* ---------- Public site header ---------- */
.site-header {
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, var(--paper-deep), var(--paper) 65%);
}
.site-header .inner { padding: 3.5rem 0 2.5rem; animation: riseIn 0.6s ease; }
.eyebrow {
  font-size: 0.875rem;
  color: var(--sage);
  margin: 0 0 0.75rem;
}
.site-title {
  font-family: 'Source Serif 4', Georgia, serif;
  font-weight: 600;
  font-size: 3.25rem;
  color: var(--ink);
  line-height: 1.05;
  margin: 0;
}
.site-desc {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 1.15rem;
  color: rgba(43,43,43,0.8);
  line-height: 1.6;
  margin: 1.25rem 0 0;
}

/* ---------- Paper list ---------- */
.paper-list { list-style: none; margin: 0; padding: 0; }
.paper-list li {
  border-bottom: 1px solid var(--rule);
  padding: 2rem 0;
  opacity: 0;
  animation: riseIn 0.5s ease forwards;
}
.paper-list li:first-child { padding-top: 0; }
.paper-row {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: 0.25rem 0.5rem;
  margin: -0.25rem -0.5rem;
  border-radius: 4px;
  transition: background 0.2s ease, transform 0.2s ease;
}
.paper-row:hover { background: rgba(169,129,45,0.06); transform: translateX(2px); }
.paper-index {
  font-size: 0.875rem;
  color: var(--brass);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.paper-row:hover .paper-index { transform: scale(1.15); }
.paper-title {
  font-family: 'Source Serif 4', Georgia, serif;
  font-weight: 600;
  font-size: 1.5rem;
  color: var(--ink);
  margin: 0;
  transition: color 0.15s;
  background-image: linear-gradient(var(--brass), var(--brass));
  background-size: 0% 1px;
  background-repeat: no-repeat;
  background-position: left bottom;
  transition: color 0.15s, background-size 0.25s ease;
}
.paper-row:hover .paper-title { color: var(--brass); background-size: 100% 1px; }
.paper-meta { font-size: 0.875rem; color: var(--sage); margin: 0.35rem 0 0; }
.paper-abstract {

function slugify(input) {
  return input
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/[\s_]+/g, "-")
    .replace(/-+/g, "-")

}

  });

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")

// Minimal Markdown -> HTML renderer (headings, bold, italic, links, lists, blockquotes, paragraphs).
// Good enough for research-note style writing; not a full CommonMark implementation.
function renderMarkdown(md) {
  if (!md) return "";

  const escapeHtml = (s) =>
    s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const inline = (text) => {
    let t = escapeHtml(text);
    t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\*(.+?)\*/g, "<em>$1</em>");
    t = t.replace(/`(.+?)`/g, "<code>$1</code>");
    t = t.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  };

  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const html = [];
  let listBuffer = [];
  let listType = null;
  let quoteBuffer = [];

  const flushList = () => {
    if (listBuffer.length) {
      const tag = listType === "ol" ? "ol" : "ul";
      html.push(`<${tag}>` + listBuffer.map((li) => `<li>${inline(li)}</li>`).join("") + `</${tag}>`);
      listBuffer = [];
      listType = null;
    }
  };
  const flushQuote = () => {
    if (quoteBuffer.length) {
      html.push(`<blockquote>${inline(quoteBuffer.join(" "))}</blockquote>`);
      quoteBuffer = [];
    }
  };

  for (const raw of lines) {
    const line = raw.trim();

    if (line === "") {
      flushList();
      flushQuote();
      continue;
    }

    if (line.startsWith("### ")) {
      flushList(); flushQuote();
      html.push(`<h3>${inline(line.slice(4))}</h3>`);
      continue;
    }
    if (line.startsWith("## ")) {
      flushList(); flushQuote();
      html.push(`<h2>${inline(line.slice(3))}</h2>`);
      continue;
    }
    if (line.startsWith("# ")) {
      flushList(); flushQuote();
      html.push(`<h2>${inline(line.slice(2))}</h2>`);
      continue;
    }
    if (line.startsWith("> ")) {
      flushList();
      quoteBuffer.push(line.slice(2));
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      flushQuote();
      listType = "ul";
      listBuffer.push(line.replace(/^[-*]\s+/, ""));
      continue;
    }
    if (/^\d+\.\s+/.test(line)) {
      flushQuote();
      listType = "ol";
      listBuffer.push(line.replace(/^\d+\.\s+/, ""));
      continue;
    }

    flushList();
    flushQuote();
    html.push(`<p>${inline(line)}</p>`);
  }
  flushList();
  flushQuote();

  return html.join("\n");
}

// Minimal hash router: maps "#/path/:param" patterns to render functions.
const routes = [];

function route(pattern, handler) {
  // Convert "/admin/edit/:id" into a regex with named groups.
  const paramNames = [];
  const regexStr = pattern
    .split("/")
    .map((seg) => {
      if (seg.startsWith(":")) {
        paramNames.push(seg.slice(1));
        return "([^/]+)";
      }
      return seg.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    })
    .join("/");
  routes.push({ regex: new RegExp(`^${regexStr}$`), paramNames, handler });
}

async function renderRoute() {
  const hash = window.location.hash.slice(1) || "/";
  const path = hash.split("?")[0];
  const queryString = hash.includes("?") ? hash.split("?")[1] : "";
  const query = new URLSearchParams(queryString);

  for (const r of routes) {
    const match = path.match(r.regex);
    if (match) {
      const params = {};
      r.paramNames.forEach((name, i) => (params[name] = decodeURIComponent(match[i + 1])));
      window.scrollTo(0, 0);
      await r.handler(params, query);
      return;
    }
  }

  document.getElementById("app").innerHTML = `<div class="wrap"><p class="empty-state" style="margin-top:3rem;">Page not found.</p></div>`;
}

    .eq("published", true)
    .order("created_at", { ascending: false });

  document.getElementById("loading").style.display = "none";

  if (error) {
    const el = document.getElementById("empty-state");
    el.style.display = "block";
    el.textContent = "Could not load papers. Check the Supabase config in js/config.js.";
    return;
  }

  if (!papers || papers.length === 0) {
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("empty-state").textContent =
      "No papers have been published yet. Check back soon.";
    return;
  }

  const listEl = document.getElementById("paper-list");
  const searchBar = document.getElementById("search-bar");
  const searchInput = document.getElementById("search-input");
  const chipRow = document.getElementById("topic-grid");
  const resultsCount = document.getElementById("results-count");
  const noResultsEl = document.getElementById("no-results");

  const tagCounts = {};
  papers.forEach((p) => (p.tags || []).forEach((t) => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const allTags = Object.keys(tagCounts).sort();
  let activeTag = null;

  if (allTags.length) {
    chipRow.innerHTML =
      `<button class="topic-card active" data-tag="">
         <p class="topic-card-name">All topics</p>
         <p class="topic-card-count">${papers.length} paper${papers.length === 1 ? "" : "s"}</p>
       </button>` +
      allTags.map((t) => `
        <button class="topic-card" data-tag="${escapeHtml(t)}">
          <p class="topic-card-name">${escapeHtml(t)}</p>
          <p class="topic-card-count">${tagCounts[t]} paper${tagCounts[t] === 1 ? "" : "s"}</p>
        </button>
      `).join("");
    chipRow.querySelectorAll(".topic-card").forEach((chip) => {
      chip.addEventListener("click", () => {
        activeTag = chip.dataset.tag || null;
        chipRow.querySelectorAll(".topic-card").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        renderList();
      });
    });
  }

  searchBar.style.display = "block";

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = papers.filter((p) => {
      const matchesTag = !activeTag || (p.tags || []).includes(activeTag);
      const haystack = [p.title, p.authors, p.abstract, ...(p.tags || [])].join(" ").toLowerCase();
      const matchesQuery = !q || haystack.includes(q);
      return matchesTag && matchesQuery;
    });

    resultsCount.textContent = `${filtered.length} of ${papers.length} paper${papers.length === 1 ? "" : "s"}`;

    if (filtered.length === 0) {
      listEl.style.display = "none";
      noResultsEl.style.display = "block";
      return;
    }
    noResultsEl.style.display = "none";
    listEl.style.display = "block";

    listEl.innerHTML = filtered.map((p, i) => `
      <li style="animation-delay:${Math.min(i * 60, 480)}ms;">
        <a href="#/paper/${encodeURIComponent(p.slug)}">
          <div class="paper-row">
            <span class="paper-index">${String(i + 1).padStart(2, "0")}</span>
            <div>
              <h2 class="paper-title serif">${escapeHtml(p.title)}</h2>
              <p class="paper-meta">${escapeHtml(p.authors)} · ${formatDate(p.created_at)}</p>
              <p class="paper-abstract">${escapeHtml(p.abstract)}</p>
              ${p.tags && p.tags.length ? `<div class="tag-row">${p.tags.map((t) => `<span>${escapeHtml(t)}</span>`).join("")}</div>` : ""}
            </div>
          </div>
        </a>
      </li>
    `).join("");
  }

  let searchDebounce;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderList, 120);
  });

  renderList();
}

// ---------- Paper detail ----------
async function viewPaper({ slug }) {
  appEl().innerHTML = `
    ${topBarHtml()}
    <div class="wrap"><a href="#/" class="back-link">← Research Papers</a></div>
    <main class="wrap" id="paper-root" style="padding-bottom:6rem;">
      <p style="font-size:0.875rem;color:var(--sage);margin-top:2rem;">Loading…</p>
    </main>
  `;

  const { data: paper, error } = await supabaseClient
    .from("papers").select("*").eq("slug", slug).eq("published", true).single();

  const root = document.getElementById("paper-root");

  if (error || !paper) {
    root.innerHTML = `<p class="empty-state" style="margin-top:2rem;">This paper could not be found.</p>`;
    return;
  }

  document.title = paper.title + " — Research Papers";

  let pdfUrl = null;
  if (paper.pdf_path) {
    const { data } = supabaseClient.storage.from("papers").getPublicUrl(paper.pdf_path);
    pdfUrl = data.publicUrl;
  }

  root.innerHTML = `
    <div class="reading-progress" id="reading-progress"></div>
    <article>
      <header class="paper-header">
        ${paper.tags && paper.tags.length ? `<div class="tag-row">${paper.tags.map((t) => `<span>${escapeHtml(t)}</span>`).join("")}</div>` : ""}
        <h1 class="paper-page-title serif" id="paper-title-text">${escapeHtml(paper.title)}</h1>
        <p class="paper-meta" style="margin-top:1rem;">${escapeHtml(paper.authors)} · ${formatDate(paper.created_at)}</p>
        <p class="paper-page-abstract" id="paper-abstract-text">${escapeHtml(paper.abstract)}</p>
        <div class="paper-actions" style="margin-top:1.5rem;">
          ${pdfUrl ? `<a href="${pdfUrl}" target="_blank" rel="noopener noreferrer" class="pdf-btn">Download PDF</a>` : ""}
          <button id="buy-paper-btn" class="pdf-btn secondary">Buy soft copy</button>
          <button id="lang-toggle-btn" class="lang-toggle" type="button">नेपाली ⇄ English</button>
        </div>
      </header>
      <div class="no-copy" id="paper-content-wrap">
        ${paper.content ? `<div class="prose-journal" id="paper-content-text">${renderMarkdown(paper.content)}</div>` : ""}
      </div>
      ${pdfUrl ? `
        <div style="margin-top:3.5rem;border-top:1px solid var(--rule);padding-top:2rem;">
          <p class="pdf-embed-label">Full document</p>
          <iframe src="${pdfUrl}" class="pdf-frame" title="${escapeHtml(paper.title)} — PDF"></iframe>
        </div>` : ""}
    </article>
  `;

  const progressBar = document.getElementById("reading-progress");
  const updateProgress = () => {
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const pct = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
    if (progressBar) progressBar.style.width = `${Math.min(pct, 100)}%`;
  };
  window.addEventListener("scroll", updateProgress);
  updateProgress();

  // ---- Copy protection on published content ----
  const contentWrap = document.getElementById("paper-content-wrap");
  ["copy", "cut", "contextmenu"].forEach((evt) => {
    contentWrap.addEventListener(evt, (e) => e.preventDefault());
  });

  // ---- Nepali <-> English toggle ----
  const isDevanagari = (text) => /[\u0900-\u097F]/.test(text);
  const originalAbstract = paper.abstract || "";
  const originalContent = paper.content || "";
  let showingTranslation = false;

  const translateText = async (text, sourceIsNepali) => {
    if (!text) return "";
    const langpair = sourceIsNepali ? "ne|en" : "en|ne";
    const chunks = text.match(/[\s\S]{1,480}/g) || [];
    const results = [];
    for (const chunk of chunks) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${langpair}`;
      const res = await fetch(url);
      const data = await res.json();
      results.push(data?.responseData?.translatedText || chunk);
    }
    return results.join(" ");
  };

  const langBtn = document.getElementById("lang-toggle-btn");
  langBtn.addEventListener("click", async () => {
    langBtn.disabled = true;
    const prevLabel = langBtn.textContent;
    langBtn.textContent = "Converting…";
    try {
      if (!showingTranslation) {
        const sourceIsNepali = isDevanagari(originalAbstract) || isDevanagari(originalContent);
        const [translatedAbstract, translatedContentRaw] = await Promise.all([
          translateText(originalAbstract, sourceIsNepali),
          translateText(originalContent, sourceIsNepali),
        ]);
        document.getElementById("paper-abstract-text").textContent = translatedAbstract;
        document.getElementById("paper-content-text").innerHTML = renderMarkdown(translatedContentRaw);
        showingTranslation = true;
        langBtn.textContent = "मौलिक भाषामा फर्कनुहोस्";
      } else {
        document.getElementById("paper-abstract-text").textContent = originalAbstract;
        document.getElementById("paper-content-text").innerHTML = renderMarkdown(originalContent);
        showingTranslation = false;
        langBtn.textContent = prevLabel === "Converting…" ? "नेपाली ⇄ English" : prevLabel;
      }
    } catch (err) {
      alert("Translation service is unavailable right now. Please try again.");
      langBtn.textContent = "नेपाली ⇄ English";
    } finally {
      langBtn.disabled = false;
    }
  });

  // ---- Buy soft copy modal ----
  document.getElementById("buy-paper-btn").addEventListener("click", () => {
    openBuyModal(paper);
  });
}

function closeModal() {
  const overlay = document.getElementById("modal-overlay");
  if (overlay) overlay.remove();
}

function openBuyModal(paper) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h2 class="modal-title serif">Buy soft copy</h2>
      <p class="modal-sub">${escapeHtml(paper.title)}</p>
      <div id="buy-error-box" class="error-box" style="display:none;"></div>
      <div id="buy-success-box" class="success-box" style="display:none;"></div>
      <form id="buy-form">
        <div class="form-group">
          <label class="form-label">Your name</label>
          <input type="text" id="buyer-name" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="buyer-email" class="form-input" required />
        </div>
        <div class="form-group">

          <input type="tel" id="buyer-phone" class="form-input" required />

        <div class="form-group">
          <label class="form-label">Preferred language</label>
          <select id="buyer-language" class="form-input">

          <button type="submit" class="btn-primary" id="buy-submit-btn">Request soft copy</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("buy-cancel-btn").addEventListener("click", closeModal);

  document.getElementById("buy-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("buy-error-box");
    const successBox = document.getElementById("buy-success-box");
    const submitBtn = document.getElementById("buy-submit-btn");
    errorBox.style.display = "none";
    successBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    try {
      const { error } = await supabaseClient.from("orders").insert({
        paper_id: paper.id,
        paper_title: paper.title,
        buyer_name: document.getElementById("buyer-name").value,
        buyer_email: document.getElementById("buyer-email").value,
        buyer_phone: document.getElementById("buyer-phone").value,
        language: document.getElementById("buyer-language").value,
      });
      if (error) throw error;
      successBox.textContent = "Request received. We'll be in touch with your soft copy shortly.";
      successBox.style.display = "block";
      document.getElementById("buy-form").reset();
      submitBtn.textContent = "Sent";
      setTimeout(closeModal, 1800);
    } catch (err) {
      errorBox.textContent = err.message || "Could not send your request. Please try again.";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Request soft copy";
    }
  });
}

    document.getElementById("panel-papers").style.display = "block";
    document.getElementById("panel-orders").style.display = "none";
  });

    document.getElementById("tab-orders").classList.add("active");
    document.getElementById("tab-papers").classList.remove("active");
    document.getElementById("panel-orders").style.display = "block";
    document.getElementById("panel-papers").style.display = "none";
    loadOrders();
  });

  async function loadOrders() {
    const loadingEl = document.getElementById("orders-loading");
    const listEl = document.getElementById("orders-list");
    const emptyEl = document.getElementById("orders-empty");
    loadingEl.style.display = "block";
    listEl.innerHTML = "";
    emptyEl.style.display = "none";

    const { data, error } = await supabaseClient
      .from("orders").select("*").order("created_at", { ascending: false });

    loadingEl.style.display = "none";
    if (error) { console.error(error); return; }
    if (!data || data.length === 0) { emptyEl.style.display = "block"; return; }

    listEl.innerHTML = data.map((o) => `
      <div class="order-card" style="${o.is_read ? "" : "border-color:var(--brass);background:rgba(169,129,45,0.06);"}">
        <p class="order-paper serif">${o.is_read ? "" : "🔵 "}${escapeHtml(o.paper_title || "")}</p>
        <p class="order-line">${escapeHtml(o.buyer_name || "")} · ${escapeHtml(o.buyer_email || "")} · ${escapeHtml(o.buyer_phone || "")}</p>
        <p class="order-line">Language: ${escapeHtml(o.language || "")} · ${o.created_at ? formatDate(o.created_at) : ""}</p>
      </div>
    `).join("");

    const unreadIds = data.filter((o) => !o.is_read).map((o) => o.id);
    if (unreadIds.length > 0) {
      await supabaseClient.from("orders").update({ is_read: true }).in("id", unreadIds);
      refreshBellBadge();
    }
  }

  let papers = [];

  async function load() {
    document.getElementById("loading").style.display = "block";
    document.getElementById("list").style.display = "none";
    document.getElementById("empty-state").style.display = "none";

    const { data, error } = await supabaseClient
      .from("papers").select("*").order("created_at", { ascending: false });

    document.getElementById("loading").style.display = "none";
    if (error) { console.error(error); return; }

    papers = data || [];
    if (papers.length === 0) {
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    const listEl = document.getElementById("list");
    listEl.style.display = "block";
    listEl.innerHTML = papers.map((p) => `
      <li>
        <div style="min-width:0;">
          <div class="admin-list-title-row">
            <h2 class="admin-list-title">${escapeHtml(p.title)}</h2>
            <span class="badge ${p.published ? "published" : "draft"}">${p.published ? "Published" : "Draft"}</span>
          </div>
          <p class="admin-list-meta">${escapeHtml(p.authors)} · ${formatDate(p.created_at)}</p>
        </div>
        <div class="row-actions">
          <button data-action="toggle" data-id="${p.id}">${p.published ? "Unpublish" : "Publish"}</button>
          <a href="#/admin/edit/${p.id}">Edit</a>
          <button class="danger" data-action="delete" data-id="${p.id}">Delete</button>
        </div>
      </li>
    `).join("");

    listEl.querySelectorAll("button[data-action='toggle']").forEach((btn) => {
      btn.addEventListener("click", () => togglePublished(btn.dataset.id));
    });
    listEl.querySelectorAll("button[data-action='delete']").forEach((btn) => {
      btn.addEventListener("click", () => handleDelete(btn.dataset.id));
    });
  }

  async function togglePublished(id) {
    const paper = papers.find((p) => p.id === id);
    if (!paper) return;
    await supabaseClient.from("papers").update({ published: !paper.published }).eq("id", id);
    load();
  }

  async function handleDelete(id) {
    const paper = papers.find((p) => p.id === id);
    if (!paper) return;
    if (!confirm(`Delete "${paper.title}"? This cannot be undone.`)) return;
    if (paper.pdf_path) await supabaseClient.storage.from("papers").remove([paper.pdf_path]);
    await supabaseClient.from("papers").delete().eq("id", id);
    load();
  }

  load();
}

  appEl().innerHTML = `

          <input type="checkbox" id="published" checked />
          <label for="published">Published (visible on the public site)</label>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">${editId ? "Save changes" : "Publish paper"}</button>
      </form>
    </main>
  `;

  attachBell();

  if (editId) {
    const { data: paper, error } = await supabaseClient.from("papers").select("*").eq("id", editId).single();

      document.getElementById("error-box").style.display = "block";

    if (existingPdfPath) {
      const note = document.getElementById("existing-pdf-note");

      note.textContent = `Current file: ${existingPdfPath} (choose a new file to replace it)`;

    const submitBtn = document.getElementById("submit-btn");
    errorBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = editId ? "Saving…" : "Publishing…";

    try {
      let pdf_path = existingPdfPath;
      const file = document.getElementById("pdf-file").files[0];

        if (uploadError) throw uploadError;

      } else {
        const slug = slugify(payload.title) || `paper-${Date.now()}`;
        const { error } = await supabaseClient.from("papers").insert({ ...payload, slug });
        if (error) throw error;
      }

      navigate("/admin");
    } catch (err) {
      errorBox.textContent = err.message || "Something went wrong while saving.";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = editId ? "Save changes" : "Publish paper";
    }
  });
}

// ---------- Route table ----------
route("/", viewHome);
route("/paper/:slug", viewPaper);
route("/admin/login", viewAdminLogin);
route("/admin", viewAdminDashboard);
route("/admin/new", viewAdminForm);
route("/admin/edit/:id", viewAdminForm);
  </script>
</body>
